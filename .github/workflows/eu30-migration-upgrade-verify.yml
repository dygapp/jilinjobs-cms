name: EU-30 Migration Upgrade Verification

on:
  pull_request:
    paths:
      - 'data-migrations/party/v1/**'
      - '!data-migrations/party/v1/**/*.md'
      - 'backend/build.gradle.kts'
      - 'backend/settings.gradle.kts'
      - 'backend/modules/cms-core/**'
      - 'backend/apps/cms-server/**'
      - 'backend/apps/content-migration/**'
      - '.github/workflows/eu30-migration-upgrade-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eu29-to-current-upgrade:
    name: Accepted Party runtime -> current Generic canonical dataset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout current Head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Materialize and normalize pinned accepted EU-29 baseline
        run: |
          set -euo pipefail
          EU29_ACCEPTED_COMMIT=59c855f55899cd613fdee059b27db762ffa3b092
          git fetch origin "$EU29_ACCEPTED_COMMIT" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EU29_ACCEPTED_COMMIT"
          mkdir -p eu29-accepted
          git archive FETCH_HEAD data-migrations/party/v1 | tar -x -C eu29-accepted

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('eu29-accepted/data-migrations/party/v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'accepted-canonical'
          assert manifest['acceptedSnapshot']['articles'] == 181
          assert manifest['acceptedSnapshot']['carouselItems'] == 4

          rows = [json.loads(line) for line in (root / 'index.ndjson').read_text(encoding='utf-8').splitlines() if line.strip()]
          (root / 'index.ndjson').write_text(
              ''.join(json.dumps({'legacyKey': row['legacyKey'], 'path': row['path']}, ensure_ascii=False) + '\n' for row in rows),
              encoding='utf-8',
          )

          list_root = root / 'lists/PARTY_CAROUSEL'
          index = json.loads((list_root / 'index.json').read_text(encoding='utf-8'))
          for reference in index['items']:
              item_path = list_root / reference['path']
              old = json.loads(item_path.read_text(encoding='utf-8'))
              assert old.get('sourceType', 'LINK') == 'LINK', old
              image = old['image']
              extension = Path(image['snapshotPath']).suffix.lstrip('.').lower()
              generic = {
                  'legacyKey': old['legacyKey'],
                  'sourceOrder': old['sourceOrder'],
                  'sourceType': 'LINK',
                  'title': old['title'],
                  'url': old['url'],
                  'sourceProvenanceUrl': old['url'],
                  'openMode': old.get('openMode', 'DEFAULT'),
                  'enabled': True,
                  'sourceFingerprint': old['sourceFingerprint'],
                  'image': {
                      'sourceUrl': image['sourceUrl'],
                      'snapshotPath': image['snapshotPath'],
                      'sha256': image['sha256'],
                      'contentType': image.get('contentType'),
                      'sizeBytes': image['sizeBytes'],
                  },
                  'staticTarget': 'migrated/party/carousel/' + image['sha256'] + '.' + extension,
              }
              item_path.write_text(json.dumps(generic, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # The accepted old snapshot is an initial state, not a transition request.
          (root / 'compatibility.json').unlink(missing_ok=True)
          PY

          jq --exit-status '
            .legacyKey == "party-carousel:position:2"
            and .sourceType == "LINK"
            and .sourceFingerprint == "c2ad182b8b2dc981a3cbe3b0153a1e3e47604c1f01dd43e6d25971e1deed10dc"'             eu29-accepted/data-migrations/party/v1/lists/PARTY_CAROUSEL/items/party-carousel-position-2/item.json > /dev/null

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Compile migration and provisioning applications
        working-directory: backend
        run: gradle :apps:cms-server:classes :apps:content-migration:classes --no-daemon

      - name: Provision stable Site Package targets
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
        run: gradle provisionSitePackage --args="../sites/jilinjobs" --no-daemon

      - name: Import normalized accepted EU-29 baseline
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/upgrade-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/upgrade-runtime/static
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upgrade-runtime/uploads" "$GITHUB_WORKSPACE/upgrade-runtime/static"
          gradle runContentMigration --args="../eu29-accepted/data-migrations/party/v1" --no-daemon | tee ../eu29-upgrade-import.log

      - name: Verify accepted baseline Runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          report=json.loads(re.findall(r'CONTENT_MIGRATION_REPORT (\{.*\})', open('eu29-upgrade-import.log', encoding='utf-8').read())[-1])
          assert report['total']==185 and report['created']==185 and report['updated']==0, report
          assert report['skipped']==0 and report['conflicts']==0 and report['invalid']==0, report
          PY

          docker run --rm --network host mysql:8.4 mysql --default-character-set=utf8mb4             -h127.0.0.1 -uroot -proot jilinjobs_cms -N -B -e             "SELECT i.id,i.source_type,COALESCE(i.article_id,''),COALESCE(i.image_path,''),COALESCE(i.image_resource_id,''),m.source_fingerprint,m.image_sha256 FROM cms_list_item i JOIN cms_list l ON l.id=i.list_id JOIN cms_list_item_legacy_mapping m ON m.list_item_id=i.id WHERE l.code='PARTY_CAROUSEL' AND m.legacy_key='party-carousel:position:2'"             | tee eu29-position2-before.tsv

          python3 - <<'PY'
          import csv
          row=next(csv.reader(open('eu29-position2-before.tsv', encoding='utf-8'), delimiter='\t'))
          item_id,source_type,article_id,image_path,image_resource_id,fingerprint,image_sha=row
          assert item_id and source_type=='LINK', row
          assert not article_id and not image_resource_id, row
          assert image_path=='/static/migrated/party/carousel/a00db48e094e24b778374ae621b6f150e235625c62f17efc860391223fac830b.png', row
          assert fingerprint=='c2ad182b8b2dc981a3cbe3b0153a1e3e47604c1f01dd43e6d25971e1deed10dc', row
          assert image_sha=='a00db48e094e24b778374ae621b6f150e235625c62f17efc860391223fac830b', row
          open('eu29-position2-id.txt','w',encoding='utf-8').write(item_id)
          PY

      - name: Upgrade the same Runtime through current Generic canonical dataset
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/upgrade-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/upgrade-runtime/static
        run: gradle runContentMigration --args="../data-migrations/party/v1" --no-daemon | tee ../current-upgrade-import.log

      - name: Verify Generic compatibility transition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          report=json.loads(re.findall(r'CONTENT_MIGRATION_REPORT (\{.*\})', open('current-upgrade-import.log', encoding='utf-8').read())[-1])
          assert report['total']==187 and report['created']==2 and report['updated']==1 and report['skipped']==184, report
          assert report['conflicts']==0 and report['invalid']==0, report
          position2=next(result for result in report['results'] if result['legacyKey']=='party-carousel:position:2')
          assert position2['status']=='UPDATED', position2
          assert any(result['legacyKey']=='zhutijiaoyu:content:154659859759104' and result['status']=='CREATED'
                     for result in report['results']), report
          PY

          docker run --rm --network host mysql:8.4 mysql --default-character-set=utf8mb4             -h127.0.0.1 -uroot -proot jilinjobs_cms -N -B -e             "SELECT i.id,i.source_type,COALESCE(i.article_id,''),COALESCE(am.legacy_key,''),COALESCE(i.image_path,''),COALESCE(i.image_resource_id,''),COALESCE(r.storage_key,''),m.source_fingerprint,m.image_sha256 FROM cms_list_item i JOIN cms_list l ON l.id=i.list_id JOIN cms_list_item_legacy_mapping m ON m.list_item_id=i.id LEFT JOIN cms_article_legacy_mapping am ON am.article_id=i.article_id LEFT JOIN cms_resource r ON r.id=i.image_resource_id WHERE l.code='PARTY_CAROUSEL' AND m.legacy_key='party-carousel:position:2'"             | tee current-position2-after.tsv

          python3 - <<'PY'
          import csv, hashlib
          from pathlib import Path
          before=open('eu29-position2-id.txt', encoding='utf-8').read().strip()
          row=next(csv.reader(open('current-position2-after.tsv', encoding='utf-8'), delimiter='\t'))
          item_id,source_type,article_id,article_legacy_key,image_path,image_resource_id,storage_key,fingerprint,image_sha=row
          assert item_id==before, (item_id,before)
          assert source_type=='ARTICLE' and article_id, row
          assert article_legacy_key=='zhutijiaoyu:content:154659859759104', row
          assert not image_path and image_resource_id and storage_key, row
          assert fingerprint=='f8b5d8df87021373803639b174bf88e46ae6cef7f2599a205763b5887c78be84', row
          assert image_sha=='a00db48e094e24b778374ae621b6f150e235625c62f17efc860391223fac830b', row
          image=Path('upgrade-runtime/uploads') / storage_key
          assert image.is_file(), image
          assert hashlib.sha256(image.read_bytes()).hexdigest()==image_sha, image
          PY

      - name: Re-run current dataset to prove post-upgrade idempotency
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/upgrade-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/upgrade-runtime/static
        run: gradle runContentMigration --args="../data-migrations/party/v1" --no-daemon | tee ../current-upgrade-second-import.log

      - name: Verify post-upgrade idempotency
        run: |
          python3 - <<'PY'
          import json, re
          report=json.loads(re.findall(r'CONTENT_MIGRATION_REPORT (\{.*\})', open('current-upgrade-second-import.log', encoding='utf-8').read())[-1])
          assert report['total']==187 and report['created']==0 and report['updated']==0 and report['skipped']==187, report
          assert report['conflicts']==0 and report['invalid']==0, report
          PY

      - name: Reject unexpected mapping fingerprint drift
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/upgrade-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/upgrade-runtime/static
        run: |
          set -euo pipefail
          docker run --rm --network host mysql:8.4 mysql --default-character-set=utf8mb4             -h127.0.0.1 -uroot -proot jilinjobs_cms -e             "UPDATE cms_list_item_legacy_mapping SET source_fingerprint=REPEAT('f',64) WHERE legacy_key='party-carousel:position:2';"

          set +e
          gradle runContentMigration --args="../data-migrations/party/v1" --no-daemon > ../current-position2-conflict.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0

          cd ..
          python3 - <<'PY'
          import json, re
          text=open('current-position2-conflict.log', encoding='utf-8').read()
          report=json.loads(re.findall(r'CONTENT_MIGRATION_REPORT (\{.*\})', text)[-1])
          assert report['total']==187 and report['conflicts']==1 and report['invalid']==0, report
          position2=next(result for result in report['results'] if result['legacyKey']=='party-carousel:position:2')
          assert position2['status']=='CONFLICT', position2
          PY

      - name: Upload upgrade verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-upgrade-verification
          path: |
            eu29-upgrade-import.log
            eu29-position2-before.tsv
            current-upgrade-import.log
            current-position2-after.tsv
            current-upgrade-second-import.log
            current-position2-conflict.log
          if-no-files-found: warn
          retention-days: 7
