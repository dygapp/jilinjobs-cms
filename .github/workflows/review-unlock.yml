name: Review Environment Unlock

on:
  push:
    branches:
      - feature/eu-29-party-history-migration
    paths:
      - .github/workflows/review-unlock.yml

concurrency:
  group: review-environment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Release stale review environment concurrency slot
        run: echo 'stale review environment cancelled; slot released'
