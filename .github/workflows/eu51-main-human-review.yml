name: EU-51 Main Human Review Environment

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact EU-51 commit/ref to review
        required: true
        default: main

concurrency:
  group: review-environment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  main-human-review:
    name: Imported Main bounded Human Review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      CMS_STORAGE_ROOT: ${{ github.workspace }}/eu51-human-runtime/uploads
      CMS_STATIC_ROOT: ${{ github.workspace }}/eu51-human-runtime/static

    steps:
      - name: Checkout exact review ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify accepted Main canonical review input
        working-directory: data-migrations
        env:
          MAIN_CANONICAL_ROOT: main/v1
        run: node tools/main-verify-accepted-articles.mjs | tee ../eu51-human-offline-verify.log

      - name: Build Backend / Public Site / Admin
        run: |
          set -euo pipefail
          (cd backend && gradle clean bootJar --no-daemon) & backend_pid=$!
          (cd frontend/public-site && npm install --no-audit --no-fund && npm run build) & public_pid=$!
          (cd frontend/admin && npm install --no-audit --no-fund && npm run build) & admin_pid=$!
          wait "$backend_pid"
          wait "$public_pid"
          wait "$admin_pid"

      - name: Prepare Fresh Human Review Runtime
        run: |
          set -euo pipefail
          rm -rf eu51-human-runtime
          mkdir -p eu51-human-runtime/uploads eu51-human-runtime/static
          (cd backend && gradle provisionSitePackage --args="../sites/jilinjobs" --no-daemon) | tee eu51-human-site-package.log
          (cd backend && gradle importCanonicalContent --args="../data-migrations/main/v1" --no-daemon) | tee eu51-human-import.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          line = next(line for line in reversed(Path('eu51-human-import.log').read_text(encoding='utf-8').splitlines()) if line.startswith('CONTENT_MIGRATION_REPORT '))
          report = json.loads(line.removeprefix('CONTENT_MIGRATION_REPORT '))
          assert report['phase'] == 'EXECUTE', report
          assert report['total'] == 3078 and report['created'] == 3078, report
          assert report['skipped'] == 0 and report['conflicts'] == 0 and report['invalid'] == 0, report
          print('EU51_HUMAN_REVIEW_IMPORT_VERIFY PASS')
          PY

      - name: Export Runtime evidence and build deterministic Human Review set
        run: |
          set -euo pipefail
          docker run --rm --network host mysql:8.4 \
            mysql --default-character-set=utf8mb4 --raw -h127.0.0.1 -uroot -proot jilinjobs_cms -N -B -e \
            "SELECT JSON_OBJECT('legacyKey',m.legacy_key,'fingerprint',m.source_fingerprint,'alias',c.alias,'articleType',a.article_type,'externalUrl',COALESCE(a.external_url,''),'runtimeId',a.id,'status',a.status,'sortOrder',a.sort_order,'publishDate',COALESCE(DATE_FORMAT(a.publish_date,'%Y-%m-%d'),''),'title',a.title,'source',a.source) FROM cms_article_legacy_mapping m JOIN cms_article a ON a.id=m.article_id JOIN cms_column c ON c.id=a.column_id WHERE m.source_system='legacy-jilinjobs' AND c.alias IN ('notice','employment-news','recruitment-announcement','policy-month','policy-outside','policy-jilin','policy-national','typical-grassroots','typical-startup','typical-military') ORDER BY m.legacy_key" \
            > eu51-human-runtime-articles.ndjson

          docker run --rm --network host mysql:8.4 \
            mysql --default-character-set=utf8mb4 --raw -h127.0.0.1 -uroot -proot jilinjobs_cms -N -B -e \
            "SELECT JSON_OBJECT('legacyKey',m.legacy_key,'role',ar.resource_role,'sortOrder',ar.sort_order,'resourceId',r.id,'storageKey',r.storage_key,'sizeBytes',r.size_bytes) FROM cms_article_legacy_mapping m JOIN cms_article_resource ar ON ar.article_id=m.article_id JOIN cms_resource r ON r.id=ar.resource_id JOIN cms_article a ON a.id=m.article_id JOIN cms_column c ON c.id=a.column_id WHERE m.source_system='legacy-jilinjobs' AND c.alias IN ('notice','employment-news','recruitment-announcement','policy-month','policy-outside','policy-jilin','policy-national','typical-grassroots','typical-startup','typical-military') ORDER BY m.legacy_key,ar.resource_role,ar.sort_order,r.id" \
            > eu51-human-runtime-resources.ndjson

          python3 data-migrations/tools/main-runtime-review-samples.py \
            --canonical-root data-migrations/main/v1 \
            --runtime-articles eu51-human-runtime-articles.ndjson \
            --runtime-resources eu51-human-runtime-resources.ndjson \
            --output frontend/public-site/main-runtime-review-samples.json \
            | tee eu51-human-sample-selection.log

      - name: Start imported Main Human Review gateway
        run: |
          set -euo pipefail
          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/runtime-static \
            -e CMS_STORAGE_ROOT=/uploads \
            -e CMS_SITE_PACKAGE_ROOT=/site-package \
            -e CMS_SITE_PACKAGE_BOOTSTRAP_ON_START=true \
            -v "$GITHUB_WORKSPACE/backend/build/libs:/app:ro" \
            -v "$GITHUB_WORKSPACE/eu51-human-runtime/static:/runtime-static" \
            -v "$GITHUB_WORKSPACE/eu51-human-runtime/uploads:/uploads" \
            -v "$GITHUB_WORKSPACE/sites/jilinjobs:/site-package:ro" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done

          docker run -d --name cms-frontend --network host \
            -v "$GITHUB_WORKSPACE/frontend/public-site/dist:/usr/share/nginx/html/public:ro" \
            -v "$GITHUB_WORKSPACE/frontend/admin/dist:/usr/share/nginx/html/admin:ro" \
            -v "$GITHUB_WORKSPACE/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29.8-alpine

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ | grep -qi '<html' \
              && curl --fail --silent http://127.0.0.1:5173/admin/ | grep -qi '<html'; then exit 0; fi
            sleep 1
          done
          docker logs cms-frontend
          exit 1

      - name: Execute AI / Browser verification before Human Review
        timeout-minutes: 18
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -e CI_EXTERNAL_WEB_SERVER=true \
            -e MAIN_MIGRATION_RUNTIME=true \
            -e MAIN_MIGRATION_REVIEW_SAMPLES=/work/main-runtime-review-samples.json \
            -v "$GITHUB_WORKSPACE/frontend/public-site:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm install --no-audit --no-fund && npx playwright test tests/e2e/main-migration-runtime.spec.ts --project=chromium --reporter=line'

      - name: Download frpc
        run: |
          set -euo pipefail
          FRP_VERSION=0.61.1
          mkdir -p frp
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz
          tar -xzf frp_${FRP_VERSION}_linux_amd64.tar.gz
          cp frp_${FRP_VERSION}_linux_amd64/frpc frp/frpc
          chmod +x frp/frpc
          test -x frp/frpc

      - name: Configure frpc
        run: |
          cat > frp/frpc.toml <<'EOF'
          serverAddr = "frps.cc-lotus.info"
          serverPort = 7000

          [[proxies]]
          name = "jilinjobs-review"
          type = "http"
          localIP = "127.0.0.1"
          localPort = 5173
          customDomains = ["review.cc-lotus.info"]
          EOF

      - name: Start frpc and verify tunnel
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            rm -f frpc.log
            ./frp/frpc -c ./frp/frpc.toml > frpc.log 2>&1 &
            FRPC_PID=$!
            sleep 5
            if kill -0 "$FRPC_PID" 2>/dev/null && grep -q "start proxy success" frpc.log; then
              echo 'EU-51 Human Review tunnel established'
              exit 0
            fi
            cat frpc.log
            kill "$FRPC_PID" 2>/dev/null || true
            wait "$FRPC_PID" 2>/dev/null || true
            if grep -q 'already exists' frpc.log && [ "$attempt" -lt 6 ]; then
              sleep 5
              continue
            fi
            exit 1
          done
          exit 1

      - name: Verify external imported Main Runtime
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --show-error --silent http://review.cc-lotus.info/ -o review-main-home.html \
              && curl --fail --show-error --silent http://review.cc-lotus.info/admin/ -o review-main-admin.html \
              && grep -qi '<html' review-main-home.html \
              && grep -qi '<html' review-main-admin.html; then break; fi
            if [ "$i" -eq 30 ]; then cat frpc.log; exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          base = 'http://review.cc-lotus.info'
          samples = json.loads(Path('frontend/public-site/main-runtime-review-samples.json').read_text(encoding='utf-8'))
          evidence = []
          for sample in samples['columnSamples']:
              with urlopen(base + '/api/public/columns/by-alias/' + quote(sample['columnAlias']), timeout=30) as response:
                  column = json.load(response)
              with urlopen(base + f"/api/public/articles?columnId={column['id']}&page=0&size=10", timeout=30) as response:
                  page = json.load(response)
              assert any(item['id'] == sample['runtimeId'] and item['title'] == sample['title'] for item in page['items']), sample
              evidence.append({'alias': sample['columnAlias'], 'runtimeId': sample['runtimeId'], 'title': sample['title']})
          for role in ('resourceRichInternal', 'longBodyInternal', 'externalLink', 'oldestPublished', 'newestPublished'):
              sample = samples['riskSamples'][role]
              with urlopen(base + f"/api/public/articles/{sample['runtimeId']}", timeout=30) as response:
                  article = json.load(response)
              assert article['title'] == sample['title'] and article['articleType'] == sample['articleType'], (role, article)
          Path('eu51-human-external-runtime.json').write_text(json.dumps({'columns': evidence, 'status': 'PASS'}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('EU51_HUMAN_EXTERNAL_RUNTIME PASS')
          PY

      - name: Record Human Review lease and bounded routes
        run: |
          set -euo pipefail
          export REVIEW_HEAD_SHA=$(git rev-parse HEAD)
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          samples = json.loads(Path('frontend/public-site/main-runtime-review-samples.json').read_text(encoding='utf-8'))
          now = datetime.datetime.now(datetime.timezone.utc)
          seconds = 2700
          owner = {
              'runId': os.environ['GITHUB_RUN_ID'],
              'headSha': os.environ['REVIEW_HEAD_SHA'],
              'mode': 'eu51-main-human-review',
              'readyAt': now.isoformat(),
              'expiresAt': (now + datetime.timedelta(seconds=seconds)).isoformat(),
              'datasetDigest': samples['datasetDigest'],
          }
          Path('frontend/public-site/dist/review-environment.json').write_text(json.dumps(owner), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'REVIEW_LEASE_SECONDS={seconds}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## EU-51 Main bounded Human Review\n\n')
              summary.write(f"Head: `{owner['headSha']}`\n\nDataset: `{owner['datasetDigest']}`\n\n")
              summary.write('Public: http://review.cc-lotus.info/\n\nAdmin: http://review.cc-lotus.info/admin/\n\n')
              summary.write('### Ten target Column routes\n\n')
              for sample in samples['columnSamples']:
                  summary.write(f"- `{sample['columnAlias']}` — http://review.cc-lotus.info/column/{sample['columnAlias']} — {sample['title']}\n")
              summary.write('\n### Representative/high-risk accepted records\n\n')
              for role, sample in samples['riskSamples'].items():
                  if not sample:
                      continue
                  if sample['articleType'] == 'INTERNAL':
                      route = f"http://review.cc-lotus.info/article/{sample['runtimeId']}"
                  else:
                      route = f"http://review.cc-lotus.info/column/{sample['columnAlias']}"
                  summary.write(f"- `{role}` — {route} — {sample['title']}\n")
              summary.write('\nAdmin review: search the representative INTERNAL / EXTERNAL_LINK titles above at http://review.cc-lotus.info/admin/articles.\n')
          print(json.dumps(owner))
          PY
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/review-environment.json -o eu51-human-review-owner.json
          cmp frontend/public-site/dist/review-environment.json eu51-human-review-owner.json

      - name: Upload EU-51 Human Review evidence
        uses: actions/upload-artifact@v7
        with:
          name: eu51-main-human-review-evidence
          path: |
            data-migrations/main/v1/manifest.json
            eu51-human-offline-verify.log
            eu51-human-site-package.log
            eu51-human-import.log
            eu51-human-runtime-articles.ndjson
            eu51-human-runtime-resources.ndjson
            eu51-human-sample-selection.log
            eu51-human-external-runtime.json
            eu51-human-review-owner.json
            frontend/public-site/main-runtime-review-samples.json
            frontend/public-site/test-results
            frontend/public-site/playwright-report
          if-no-files-found: error
          retention-days: 7

      - name: Output Human Review address
        run: |
          echo 'EU-51 Main public review: http://review.cc-lotus.info/'
          echo 'EU-51 Main admin review: http://review.cc-lotus.info/admin/'
          echo 'Review scope: accepted 3078 Main Articles only; deferred/source-defect/Page/List remain excluded.'

      - name: Keep Human Review environment running
        run: sleep "$REVIEW_LEASE_SECONDS"

      - name: Cleanup Human Review environment
        if: always()
        run: |
          docker rm -f cms-backend cms-frontend || true
          pkill -f '/frp/frpc' || true
