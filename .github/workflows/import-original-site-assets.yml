name: 导入原站视觉资源

on:
  push:
    branches:
      - feature/site-visual-fidelity-20260828
    paths:
      - .github/workflows/import-original-site-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: feature/site-visual-fidelity-20260828

      - name: 下载已取证的原站资源
        run: |
          set -euo pipefail
          mkdir -p site-baseline/static/brand site-baseline/static/home site-baseline/static/icons
          base='https://24365.jl.smartedu.cn'
          curl -fsSL "$base/webfile/theme2/img/smartedu_logo_1.png" -o site-baseline/static/brand/smartedu-logo-icon.png
          curl -fsSL "$base/webfile/theme2/img/smartedu_logo_2.png" -o site-baseline/static/brand/smartedu-logo-text.png
          curl -fsSL "$base/group1/cms/t_biz_attachment/siteattr2/2025-03-21/2dcd7302-55ba-469a-aad1-711309fada4a.png" -o site-baseline/static/home/header-banner.png
          curl -fsSL "$base/group1/cms/t_biz_attachment/content1/2024-04-30/1ae0fd90-2836-4508-9c02-2a6da45c5642.jpg" -o site-baseline/static/home/carousel-01.jpg
          curl -fsSL "$base/group1/cms/t_biz_attachment/content1/2026-07-14/low/d9f7b71c-fa9b-4c1c-800d-ae92b22e6e5f.png" -o site-baseline/static/home/recruitment-campaign.png
          curl -fsSL "$base/webfile/theme2/img/index/logo20220715.png" -o site-baseline/static/home/ncss-logo.png
          curl -fsSL "$base/webfile/theme2/img/index/student_icon_white.png" -o site-baseline/static/icons/student.png
          curl -fsSL "$base/webfile/theme2/img/arrow_down_line@2x.png" -o site-baseline/static/icons/arrow-down.png
          curl -fsSL "$base/webfile/theme2/img/index/ic_more_gray@2x.png" -o site-baseline/static/icons/more.png
          curl -fsSL "$base/webfile/theme2/img/index/dian-hua@2x.png" -o site-baseline/static/icons/phone.png
          curl -fsSL "$base/webfile/theme2/img/index/mark_y@2x.png" -o site-baseline/static/icons/section-mark.png
          for i in 01 02 03 04 05; do
            curl -fsSL "$base/webfile/theme2/img/index/ic_top_nav_${i}@2x.png" -o "site-baseline/static/icons/top-nav-${i}.png"
          done
          for i in 01 02 03 04 05 06; do
            curl -fsSL "$base/webfile/theme2/img/index/ic_nav_blue_${i}@2x.png" -o "site-baseline/static/icons/guide-${i}.png"
          done
          test -s site-baseline/static/home/header-banner.png
          test -s site-baseline/static/home/carousel-01.jpg
          test -s site-baseline/static/home/recruitment-campaign.png
          test -s site-baseline/static/brand/smartedu-logo-text.png

      - name: 提交资源基线
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-baseline/static
          if git diff --cached --quiet; then
            echo '资源无变化'
            exit 0
          fi
          git commit -m 'feat(visual): 纳入原站关键视觉资源'
          git push origin HEAD:feature/site-visual-fidelity-20260828
