name: Generic Content Migration Verification

on:
  push:
    branches: [main]
    paths:
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/modules/cms-core/**"
      - "backend/apps/content-migration/**"
      - "data-migrations/schemas/**"
      - "!data-migrations/schemas/**/*.md"
      - ".github/workflows/generic-content-migration-verification.yml"
  pull_request:
    paths:
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/modules/cms-core/**"
      - "backend/apps/content-migration/**"
      - "data-migrations/schemas/**"
      - "!data-migrations/schemas/**/*.md"
      - ".github/workflows/generic-content-migration-verification.yml"

permissions:
  contents: read

jobs:
  generic-content-migration:
    name: Generic content migration verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: generic_content_migration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Verify generic source purity
        shell: bash
        run: |
          set -euo pipefail
          generic_root="backend/apps/content-migration/src/main/kotlin/com/jilinjobs/cms/migration/generic"
          forbidden='party-|PARTY_CAROUSEL|party-carousel:position:|EU29|EU30|migrated/party/'
          if grep -RniE "$forbidden" "$generic_root"; then
            echo "Generic migration source contains compatibility-only identity"
            exit 1
          fi
      - name: Verify generic migration behavior and non-web composition
        working-directory: backend
        env:
          GENERIC_MIGRATION_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/generic_content_migration?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          GENERIC_MIGRATION_VERIFY_DB_USERNAME: root
          GENERIC_MIGRATION_VERIFY_DB_PASSWORD: root
          MIGRATION_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/generic_content_migration?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          MIGRATION_VERIFY_DB_USERNAME: root
          MIGRATION_VERIFY_DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/generic-content-migration/boundary-uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/generic-content-migration/boundary-static
        run: gradle verifyGenericContentMigration verifyGenericPageContentMigration verifyContentMigrationBoundary --no-daemon
