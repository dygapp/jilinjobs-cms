              Path(path).write_text(text, encoding='utf-8')

          def sub(path, pattern, replacement, expected=1, flags=0):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=expected, flags=flags)
              assert count == expected, f'{path}: expected {expected} replacement(s), got {count}: {pattern}'
              write(path, new)

          def replace(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              assert count == expected, f'{path}: expected {expected} occurrence(s), got {count}: {old}'
              write(path, text.replace(old, new, expected))

