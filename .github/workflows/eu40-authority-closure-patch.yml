name: EU-40 Authority Closure Patch

on:
  push:
    branches: [docs/eu40-post-integration-closure]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/eu40-post-integration-closure
          fetch-depth: 0
      - name: Patch Authority
        run: |
          sed -i 's/assert "V2 compatibility responsibility" in read("docs\/project\/site-package-planning.md")/assert "compatibility responsibility" in read("docs\/project\/site-package-planning.md")/' .github/eu40-authority-closure.py
          python3 .github/eu40-authority-closure.py
      - name: Validate and commit
        run: |
          set -euo pipefail
          git checkout -- .github/eu40-authority-closure.py
          git diff --check
          test -n "$(git status --porcelain)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md README.md docs/project/project-roadmap.md docs/project/site-package-planning.md docs/requirements/cms-site-package-boundary.md docs/specifications/cms-site-package-boundary.md docs/technical/cms-site-package-boundary.md docs/work/eu40-explicit-site-package-runtime-composition.md
          git commit -m "docs(eu40): 收口 Post-Integration Authority"
          git push origin HEAD:docs/eu40-post-integration-closure
