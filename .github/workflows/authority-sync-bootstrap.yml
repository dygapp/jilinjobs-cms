name: Authority Sync Bootstrap

on:
  push:
    branches:
      - docs/eu35-authority-sync

permissions:
  contents: write

jobs:
  sync-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: docs/eu35-authority-sync

      - name: Synchronize current project authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'AGENTS.md',
              '中心党建正式页面、真实栏目、历史内容迁移与最终 Review 已由 EU-26～EU-29 收敛完成；EU-30 Carousel Architecture & Behavior Convergence 已完成最终 Human Review、canonical acceptance 与 post-promotion verification；**EU-31 Database Migration Baseline Convergence 已完成实现、验证并合并到 `main`。当前没有 Ready Execution Unit。** 后续只允许从本仓库 GitHub Issues #57 / #59 / #60 的 Planning / Requirement Candidates 中选择目标，并按 `docs/project/development-method.md` 完成 Intent / Requirement Clarification、Specification 与必要 Technical Planning / Research；只有上游已经 Ready 时，`slice-work` 才形成 Candidate Execution Unit，并可为其分配稳定 Identifier；只有 `readiness-check` PASS 后才晋升为 Ready Execution Unit 并允许进入 Execute。不得从其他项目、其他会话、个人记忆、旧预编号路线、惯例或实现便利性中推导、补充或扩大本项目的产品范围。',
              '中心党建正式页面、真实栏目、历史内容迁移与最终 Review 已由 EU-26～EU-29 收敛完成；EU-30 Carousel Architecture & Behavior Convergence 与 EU-31 Database Migration Baseline Convergence 已完成；随后 Issue #60 / B1～B3 已依次收敛为 EU-32～EU-35：EU-32 List Definition Group Governance、EU-33 Admin Guidance & Explanation Responsibility Governance、EU-34 Rich Text HTML Safety Foundation、EU-35 Shared Rich Text Authoring 均已完成实现、集成并通过 Post-Integration Verification。**当前没有 Ready Execution Unit。** 后续只允许从本仓库 GitHub Issues #57 / #59 / #60 的剩余 Planning / Requirement Candidates 中选择目标，并按 `docs/project/development-method.md` 完成 Intent / Requirement Clarification、Specification 与必要 Technical Planning / Research；只有上游已经 Ready 时，`slice-work` 才形成 Candidate Execution Unit，并可为其分配稳定 Identifier；只有 `readiness-check` PASS 后才晋升为 Ready Execution Unit 并允许进入 Execute。不得从其他项目、其他会话、个人记忆、旧预编号路线、惯例或实现便利性中推导、补充或扩大本项目的产品范围。'
          )

          replace(
              'README.md',
              '中心党建 EU-26～EU-29、EU-30 Carousel Architecture & Behavior Convergence 以及 **EU-31 Database Migration Baseline Convergence 均已完成并收敛到 `main`。当前没有 Ready Execution Unit。** 后续工作统一回到 GitHub Issues #57 / #59 / #60 的 Planning / Requirement Candidates：候选先完成必要 Intent / Requirement Clarification、Ready Specification 与必要 Technical Planning / Research；随后由 `slice-work` 形成 Candidate Execution Unit 并可分配稳定 Identifier，只有 `readiness-check` PASS 后才成为 Ready Execution Unit。Roadmap 顺序、预编号或 Issue 标签本身不构成执行授权。',
              '中心党建 EU-26～EU-29、EU-30 Carousel Architecture & Behavior Convergence、EU-31 Database Migration Baseline Convergence，以及 Issue #60 / B1～B3 收敛形成的 **EU-32～EU-35 均已完成并收敛到 `main`。当前没有 Ready Execution Unit。** 后续工作统一回到 GitHub Issues #57 / #59 / #60 的剩余 Planning / Requirement Candidates：候选先完成必要 Intent / Requirement Clarification、Ready Specification 与必要 Technical Planning / Research；随后由 `slice-work` 形成 Candidate Execution Unit 并可分配稳定 Identifier，只有 `readiness-check` PASS 后才成为 Ready Execution Unit。Roadmap 顺序、预编号或 Issue 标签本身不构成执行授权。'
          )

          replace(
              'README.md',
              '- `docs/requirements/database-migration-baseline-convergence.md`（EU-31 已完成；其 accepted baseline / append-only 边界继续有效）',
              '- `docs/requirements/database-migration-baseline-convergence.md`（EU-31 已完成；其 accepted baseline / append-only 边界继续有效）\n- `docs/requirements/list-definition-group-governance.md`（EU-32 accepted）\n- `docs/requirements/admin-guidance-governance.md`（EU-33 accepted）\n- `docs/requirements/rich-text-authoring.md`（EU-34 / EU-35 accepted）'
          )
          replace(
              'README.md',
              '- `docs/specifications/database-migration-baseline-convergence.md`（EU-31 accepted baseline）',
              '- `docs/specifications/database-migration-baseline-convergence.md`（EU-31 accepted baseline）\n- `docs/specifications/list-definition-group-governance.md`（EU-32 accepted）\n- `docs/specifications/admin-guidance-governance.md`（EU-33 accepted）\n- `docs/specifications/rich-text-authoring.md`（EU-34 / EU-35 accepted）'
          )
          replace(
              'README.md',
              '- `docs/technical/database-migration-baseline-convergence.md`（EU-31 accepted baseline）',
              '- `docs/technical/database-migration-baseline-convergence.md`（EU-31 accepted baseline）\n- `docs/technical/rich-text-authoring-plan.md`（EU-34 / EU-35 accepted technical plan）'
          )
          replace(
              'README.md',
              '最近完成的执行单元：\n\n- `docs/work/eu31-database-migration-baseline-convergence.md`（COMPLETED）',
              '最近完成的执行单元：\n\n- `docs/work/eu35-shared-rich-text-authoring.md`（COMPLETED）\n- `docs/work/eu34-rich-text-html-safety-foundation.md`（COMPLETED）\n- `docs/work/eu33-admin-guidance-governance.md`（COMPLETED）\n- `docs/work/eu32-list-definition-group-governance.md`（COMPLETED）\n- `docs/work/eu31-database-migration-baseline-convergence.md`（COMPLETED）'
          )
          replace(
              'README.md',
              '管理端双前端拆分、通用 CMS 模型和 Admin Modular SPA 已完成当前阶段收敛；公开站 Multi-entry Modular SPA、中心党建正式页面与历史内容、EU-30 轮播架构与行为、EU-31 数据库迁移基线也已完成当前阶段收敛。下一步不得从历史预编号路线直接开始实现，应从当前 Planning / Requirement Candidates 中选择目标并按 Consumer-local Method 形成 Candidate Execution Unit，通过 Readiness 后再进入 Execute。',
              '管理端双前端拆分、通用 CMS 模型和 Admin Modular SPA 已完成当前阶段收敛；公开站 Multi-entry Modular SPA、中心党建正式页面与历史内容、EU-30 轮播架构与行为、EU-31 数据库迁移基线，以及 EU-32～EU-35 的列表结构治理、管理端提示责任治理与富文本安全/编辑能力也已完成当前阶段收敛。下一步不得从历史预编号路线直接开始实现，应从当前剩余 Planning / Requirement Candidates 中选择目标并按 Consumer-local Method 形成 Candidate Execution Unit，通过 Readiness 后再进入 Execute。'
          )

          replace(
              'docs/project/project-roadmap.md',
              '| EU-31 Database Migration Baseline Convergence | **已完成** | V1～V20 开发期 Flyway transcript 已收敛为当前 schema + preset curated baseline，历史 Party migration knowledge 保留；后续 schema 恢复 append-only 演进 |\n| 后续 Planning / Requirement Candidates | **当前规划层** | Issues #57 / #59 / #60 中剩余候选尚未形成新的 Ready Execution Unit，需按当前方法从 Candidate 推进到 Ready Specification、Candidate Unit 与 Readiness Gate |',
              '| EU-31 Database Migration Baseline Convergence | **已完成** | V1～V20 开发期 Flyway transcript 已收敛为当前 schema + preset curated baseline，历史 Party migration knowledge 保留；后续 schema 恢复 append-only 演进 |\n| EU-32 List Definition Group Governance | **已完成** | `groupCode` 保持内部结构元数据，ordinary Admin 不再暴露结构分组写权限 |\n| EU-33 Admin Guidance & Explanation Responsibility Governance | **已完成** | 管理界面保留操作必要信息，结构身份与实现背景退出普通运营提示 |\n| EU-34～EU-35 Rich Text Safety & Shared Authoring | **已完成** | 服务端 HTML safety foundation + Article/Page 共用 Tiptap 富文本编辑能力完成并通过 Post-Integration Verification |\n| 后续 Planning / Requirement Candidates | **当前规划层** | Issues #57 / #59 / #60 中剩余候选尚未形成新的 Ready Execution Unit，需按当前方法从 Candidate 推进到 Ready Specification、Candidate Unit 与 Readiness Gate |'
          )
          replace(
              'docs/project/project-roadmap.md',
              '| 2026-09-05 | Validation Baseline 更新到 `agentic-dev master@d9fad0da83dbdb61cac5eb9778b0258c6861eef1`，选择性固化 Planning Candidate → Candidate Execution Unit → Ready Execution Unit 身份边界；Capability Milestone 保持不变 |',
              '| 2026-09-05 | Validation Baseline 更新到 `agentic-dev master@d9fad0da83dbdb61cac5eb9778b0258c6861eef1`，选择性固化 Planning Candidate → Candidate Execution Unit → Ready Execution Unit 身份边界；Capability Milestone 保持不变 |\n| 2026-09-05 | Issue #60 / B1 收敛为 EU-32，完成列表定义内部 `groupCode` 与 ordinary Admin 写权限边界治理并集成 |\n| 2026-09-05 | Issue #60 / B2 收敛为 EU-33，完成管理端用户提示、结构身份与实现解释责任治理并集成 |\n| 2026-09-05 | Issue #60 / B3 先后形成 EU-34 / EU-35：服务端 Rich Text HTML safety foundation 与 Article/Page shared Tiptap authoring 均完成、集成并通过 Post-Integration CI |'
          )
          replace(
              'docs/project/project-roadmap.md',
              '## 已完成阶段：管理端工程分离与功能收敛',
              '### EU-32～EU-35 管理端治理与富文本能力\n\n- EU-32：`CmsList.groupCode` 继续作为内部结构元数据；ordinary Admin create 使用 `GENERAL`，update 保留已有结构分组，管理界面不再暴露分组输入；\n- EU-33：用户可见提示只承担当前操作所需信息；结构身份、实现原因和 Method/Requirement 解释不再作为普通运营提示重复暴露；\n- EU-34：Article/Page 共用服务端 HTML safety policy，写入与公开读取边界均执行安全收敛，legacy 内容不批量改写；\n- EU-35：Article/Page 共用 CMS-local Tiptap `RichTextEditor`，保留 Article managed Resource association 与 Page 既有边界；\n- EU-34 / EU-35 共同保持 `bodyHtml` 为唯一持久 HTML contract，不引入第二正文 Authority。\n\n## 已完成阶段：管理端工程分离与功能收敛'
          )
          replace(
              'docs/project/project-roadmap.md',
              'Issue #59 / #60 中除已完成 EU-31 的数据库 baseline 外，其余候选仍属于 Planning / Requirement Candidates；Issue #57 仍是可选导航架构讨论，不自动晋升。',
              'Issues #59 / #60 中除已完成的 EU-31～EU-35 对应事项外，其余候选仍属于 Planning / Requirement Candidates；Issue #57 仍是可选导航架构讨论，不自动晋升。'
          )
          replace(
              'docs/project/project-roadmap.md',
              '- EU-31 Database Migration Baseline Convergence 已完成并集成，不是历史预编号 Browser Compatibility；\n- 当前没有 Ready Execution Unit；Issues #57 / #59 / #60 中剩余候选不得因 Roadmap、旧 Execution Plan、预编号或 Issue 标签直接进入实现；',
              '- EU-31 Database Migration Baseline Convergence 已完成并集成，不是历史预编号 Browser Compatibility；\n- EU-32～EU-35 已按 Issue #60 / B1～B3 的实际 Requirement / Specification / Slice / Readiness 链完成并集成；\n- 当前没有 Ready Execution Unit；Issues #57 / #59 / #60 中剩余候选不得因 Roadmap、旧 Execution Plan、预编号或 Issue 标签直接进入实现；'
          )
          replace(
              'docs/project/project-roadmap.md',
              '8. 已完成 EU-31 追溯文档：`docs/requirements/database-migration-baseline-convergence.md`、`docs/specifications/database-migration-baseline-convergence.md`、`docs/technical/database-migration-baseline-convergence.md`、`docs/work/eu31-database-migration-baseline-convergence.md`（仅在相关工作需要时读取）\n9. 当前 Branch / PR / CI / Runtime Evidence',
              '8. 已完成 EU-31～EU-35 的追溯文档仅在相关工作需要时读取；当前状态优先由本 Roadmap 与对应 Requirement / Specification / Work Artifact 恢复\n9. 当前 Branch / PR / CI / Runtime Evidence'
          )
          PY

          git diff --check
          git diff -- AGENTS.md README.md docs/project/project-roadmap.md

      - name: Commit synchronized authority and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs/project/project-roadmap.md
          git rm .github/workflows/authority-sync-bootstrap.yml
          git commit -m "docs(project): 同步 EU-32 至 EU-35 当前状态"
          git push origin HEAD:docs/eu35-authority-sync
