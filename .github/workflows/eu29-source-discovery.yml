name: EU-29 Party Migration Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data-migrations/**'
      - 'backend/src/main/kotlin/com/jilinjobs/cms/migration/**'
      - 'backend/src/main/resources/db/migration/V17__historical_article_migration_mapping.sql'
      - 'backend/src/main/resources/db/migration/V18__historical_carousel_migration_mapping.sql'
      - 'backend/build.gradle.kts'
      - 'frontend/public-site/tests/e2e/party-migration-source-discovery.spec.ts'
      - '.github/workflows/eu29-source-discovery.yml'

concurrency:
  group: eu29-party-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate:
    name: Collect and verify legacy Party migration
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/eu-29-party-history-migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Pull Playwright runtime
        run: docker pull mcr.microsoft.com/playwright:v1.61.0-noble
      - name: Capture HTTP / DOM / Network evidence
        run: |
          docker run --rm --init --ipc=host \
            -e CI=true \
            -e PARTY_MIGRATION_DISCOVERY=true \
            -v "$GITHUB_WORKSPACE/frontend/public-site:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm install --no-audit --no-fund && npx playwright test tests/e2e/party-migration-source-discovery.spec.ts --reporter=line'
      - name: Install migration collector dependencies
        working-directory: data-migrations
        run: npm install --no-audit --no-fund
      - name: Collect full Party migration snapshot candidate
        working-directory: data-migrations
        env:
          MIGRATION_OUTPUT: party/v1/generated
        run: npm run collect:party
      - name: Require clean reconciliation
        run: |
          node - <<'NODE'
          const report = require('./data-migrations/party/v1/generated/reports/reconciliation.json')
          const carousel = require('./data-migrations/party/v1/generated/carousel.json')
          console.log(JSON.stringify(report, null, 2))
          console.log(JSON.stringify(carousel, null, 2))
          if (report.listedRecords !== report.normalizedRecords) throw new Error(`listed=${report.listedRecords} normalized=${report.normalizedRecords}`)
          if (report.unresolved !== 0) throw new Error(`unresolved=${report.unresolved}`)
          if (report.home?.carouselItems !== 4 || carousel.items?.length !== 4) throw new Error(`carousel=${report.home?.carouselItems}/${carousel.items?.length}`)
          if (new Set(carousel.items.map(item => item.sourceOrder)).size !== 4) throw new Error('carousel sourceOrder is not unique')
          for (const scope of report.scopes) {
            if (scope.reportedTotal !== scope.uniqueCount) throw new Error(`${scope.typeCode}: reported=${scope.reportedTotal}, unique=${scope.uniqueCount}`)
          }
          NODE
      - name: Verify backend and Flyway on fresh MySQL
        working-directory: backend
        run: gradle clean test classes --no-daemon
      - name: Import article snapshot into fresh Runtime DB
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/eu29-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/eu29-runtime/static
        run: |
          mkdir -p "$GITHUB_WORKSPACE/eu29-runtime/uploads" "$GITHUB_WORKSPACE/eu29-runtime/static"
          gradle importPartyHistoricalContent --args="../data-migrations/party/v1/generated" --no-daemon | tee ../eu29-first-import.log
      - name: Verify first article import reconciliation
        run: |
          python3 - <<'PY'
          import json, re
          expected=json.load(open('data-migrations/party/v1/generated/reports/reconciliation.json', encoding='utf-8'))['normalizedRecords']
          text=open('eu29-first-import.log', encoding='utf-8').read()
          matches=re.findall(r'EU29_IMPORT_REPORT (\{.*\})', text)
          assert matches, 'missing EU29_IMPORT_REPORT'
          report=json.loads(matches[-1])
          assert report['total']==expected, (report['total'], expected)
          assert report['created']==expected, report
          assert report['skipped']==0 and report['conflicts']==0 and report['invalid']==0, report
          print(json.dumps({k:report[k] for k in ('total','created','skipped','conflicts','invalid')}, ensure_ascii=False))
          PY
      - name: Import Party carousel snapshot
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/eu29-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/eu29-runtime/static
        run: gradle importPartyCarousel --args="../data-migrations/party/v1/generated" --no-daemon | tee ../eu29-first-carousel-import.log
      - name: Verify first carousel import and bytes
        run: |
          python3 - <<'PY'
          import json, re
          text=open('eu29-first-carousel-import.log', encoding='utf-8').read()
          matches=re.findall(r'EU29_CAROUSEL_IMPORT_REPORT (\{.*\})', text)
          assert matches, 'missing EU29_CAROUSEL_IMPORT_REPORT'
          report=json.loads(matches[-1])
          assert report['total']==4 and report['created']==4, report
          assert report['skipped']==0 and report['conflicts']==0 and report['invalid']==0, report
          PY
          docker run --rm --network host mysql:8.4 mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot jilinjobs_cms -N -B -e \
            "SELECT i.sort_order,i.title,COALESCE(i.url,''),COALESCE(i.image_path,''),i.open_mode,COALESCE(m.legacy_key,''),COALESCE(m.image_sha256,'') FROM cms_list_item i JOIN cms_list l ON l.id=i.list_id LEFT JOIN cms_list_item_legacy_mapping m ON m.list_item_id=i.id WHERE l.code='PARTY_CAROUSEL' ORDER BY i.sort_order,i.id" \
            | tee eu29-carousel-db.tsv
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          snapshot=json.load(open('data-migrations/party/v1/generated/carousel.json', encoding='utf-8'))
          rows=list(csv.reader(open('eu29-carousel-db.tsv', encoding='utf-8'), delimiter='\t'))
          assert len(rows)==4, rows
          expected=sorted(snapshot['items'], key=lambda item:item['sourceOrder'])
          for item,row in zip(expected,rows):
              order,title,url,image_path,open_mode,legacy_key,image_sha=row
              assert int(order)==item['sourceOrder'], (row,item)
              assert title==item['title'], (title,item['title'])
              assert url==item['url'], (url,item['url'])
              assert open_mode==item['openMode'], (open_mode,item['openMode'])
              assert legacy_key==item['legacyKey'], (legacy_key,item['legacyKey'])
              assert image_sha==item['image']['sha256'], (image_sha,item['image']['sha256'])
              assert image_path.startswith('/static/migrated/party/carousel/'), image_path
              file=Path('eu29-runtime/static') / image_path.removeprefix('/static/')
              assert file.is_file(), file
              assert hashlib.sha256(file.read_bytes()).hexdigest()==item['image']['sha256'], file
          print(json.dumps([{k:item[k] for k in ('sourceOrder','title','url','openMode')} for item in expected], ensure_ascii=False, indent=2))
          PY
      - name: Import same article snapshot again to prove idempotency
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/eu29-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/eu29-runtime/static
        run: gradle importPartyHistoricalContent --args="../data-migrations/party/v1/generated" --no-daemon | tee ../eu29-second-import.log
      - name: Import same carousel snapshot again to prove idempotency
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/eu29-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/eu29-runtime/static
        run: gradle importPartyCarousel --args="../data-migrations/party/v1/generated" --no-daemon | tee ../eu29-second-carousel-import.log
      - name: Verify idempotency and Party Runtime counts
        run: |
          python3 - <<'PY'
          import json, re
          expected=json.load(open('data-migrations/party/v1/generated/reports/reconciliation.json', encoding='utf-8'))
          text=open('eu29-second-import.log', encoding='utf-8').read()
          matches=re.findall(r'EU29_IMPORT_REPORT (\{.*\})', text)
          assert matches, 'missing second EU29_IMPORT_REPORT'
          report=json.loads(matches[-1])
          assert report['total']==expected['normalizedRecords'], report
          assert report['created']==0 and report['skipped']==expected['normalizedRecords'], report
          assert report['conflicts']==0 and report['invalid']==0, report

          text=open('eu29-second-carousel-import.log', encoding='utf-8').read()
          matches=re.findall(r'EU29_CAROUSEL_IMPORT_REPORT (\{.*\})', text)
          assert matches, 'missing second EU29_CAROUSEL_IMPORT_REPORT'
          carousel=json.loads(matches[-1])
          assert carousel['total']==4 and carousel['created']==0 and carousel['skipped']==4, carousel
          assert carousel['conflicts']==0 and carousel['invalid']==0, carousel
          PY
          docker run --rm --network host mysql:8.4 mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot jilinjobs_cms -N -e \
            "SELECT c.alias, COUNT(a.id), COUNT(m.id) FROM cms_column c LEFT JOIN cms_article a ON a.column_id=c.id AND a.status='PUBLISHED' LEFT JOIN cms_article_legacy_mapping m ON m.article_id=a.id WHERE c.alias IN ('party-voice','party-work','party-rules','party-study') GROUP BY c.alias ORDER BY c.alias" \
            | tee eu29-db-counts.tsv
          node - <<'NODE'
          const fs=require('fs')
          const expected=require('./data-migrations/party/v1/generated/reports/reconciliation.json')
          const byAlias=new Map(expected.scopes.map(s=>[s.columnAlias,s.uniqueCount]))
          const rows=fs.readFileSync('eu29-db-counts.tsv','utf8').trim().split(/\n/).filter(Boolean).map(line=>line.split('\t'))
          if (rows.length !== 4) throw new Error(`expected 4 Party columns, got ${rows.length}`)
          for (const [alias, articles, mappings] of rows) {
            if (Number(articles)!==byAlias.get(alias) || Number(mappings)!==byAlias.get(alias)) throw new Error(`${alias}: articles=${articles}, mappings=${mappings}, expected=${byAlias.get(alias)}`)
          }
          console.log(rows)
          NODE
          carousel_items=$(docker run --rm --network host mysql:8.4 mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot jilinjobs_cms -N -e "SELECT COUNT(*) FROM cms_list_item i JOIN cms_list l ON l.id=i.list_id WHERE l.code='PARTY_CAROUSEL'")
          carousel_mappings=$(docker run --rm --network host mysql:8.4 mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot jilinjobs_cms -N -e "SELECT COUNT(*) FROM cms_list_item_legacy_mapping")
          test "$carousel_items" -eq 4
          test "$carousel_mappings" -eq 4
      - name: Upload source discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eu29-party-source-discovery
          path: frontend/public-site/test-results
          if-no-files-found: error
          retention-days: 7
      - name: Upload migration snapshot and import evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eu29-party-migration-evidence
          path: |
            data-migrations/party/v1/generated
            eu29-first-import.log
            eu29-second-import.log
            eu29-first-carousel-import.log
            eu29-second-carousel-import.log
            eu29-db-counts.tsv
            eu29-carousel-db.tsv
          if-no-files-found: warn
          retention-days: 7
