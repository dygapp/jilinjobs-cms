name: PR18 Review Fixture Patch

on:
  push:
    branches:
      - feature/page-detail-visual-convergence-20260828
    paths:
      - .github/workflows/patch-pr18-review-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/page-detail-visual-convergence-20260828
          fetch-depth: 0

      - name: Patch authority and review fixture
        run: python3 .github/scripts/patch-pr18-review-fixture.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/requirements/information-publishing.md .github/workflows/review-environment.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs(content): 固化外链招聘公告规则"
          git push origin HEAD:feature/page-detail-visual-convergence-20260828
