name: EU-52 bounded FAQ heading correction

on:
  push:
    branches:
      - feature/eu-52-main-page-package-adoption
    paths:
      - .github/workflows/eu52-faq-heading-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/eu-52-main-page-package-adoption
          fetch-depth: 0

      - name: Apply bounded FAQ correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          pages_path = Path('sites/jilinjobs/structure/pages.json')
          manifest_path = Path('sites/jilinjobs/manifest.json')
          css_path = Path('frontend/public-site/src/sites/main/styles/public-pages.css')
          test_path = Path('frontend/public-site/tests/e2e/main-page-formal-content.spec.ts')

          questions = [
              '1. 学历认证项目有哪些',
              '2.如何办理学历认证？',
              '3.可免费申请书面认证报告的高等教育学历证书包括哪些？',
              '4.普通、成人高等教育学历证书认证需要提供哪些材料',
              '5.自学考试学历证书认证提供哪些材料？',
              '6.军队证书，如何办理呢？',
              '7.认证报告如何领取？',
              '8.学历认证的办理周期',
              '9.如何查询认证进度？',
              '10.学历认证未通过，该怎么办？',
          ]

          pages = pages_path.read_text(encoding='utf-8')
          for question in questions:
              old = f'<p>{question}</p>'
              new = f'<h2 class=\\"faq-question\\">{question}</h2>'
              count = pages.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one FAQ heading source for {question!r}, found {count}')
              pages = pages.replace(old, new, 1)

          parsed = json.loads(pages)
          faq = next((page for page in parsed if page.get('groupAlias') == 'guide' and page.get('alias') == 'faq'), None)
          if faq is None:
              raise SystemExit('guide/faq Page missing after correction')
          if faq['bodyHtml'].count('<h2 class="faq-question">') != 10:
              raise SystemExit('FAQ must contain exactly ten promoted headings')
          for question in questions:
              if f'<h2 class="faq-question">{question}</h2>' not in faq['bodyHtml']:
                  raise SystemExit(f'Promoted FAQ heading missing: {question}')
          pages_path.write_text(pages, encoding='utf-8')
          pages_sha = hashlib.sha256(pages_path.read_bytes()).hexdigest()

          manifest = manifest_path.read_text(encoding='utf-8')
          old_version = '"version": "0.5.0-main-page-formal-content"'
          new_version = '"version": "0.5.1-main-page-faq-heading"'
          if manifest.count(old_version) != 1:
              raise SystemExit('Unexpected Site Package version before FAQ correction')
          manifest = manifest.replace(old_version, new_version, 1)
          old_pages_sha = '"sha256":"9c39e9dbb2a36843a8f2a2cf2c29402031a74afe5e52133e2f89151e6d452587"'
          new_pages_sha = f'"sha256":"{pages_sha}"'
          if manifest.count(old_pages_sha) != 1:
              raise SystemExit('Unexpected pages.json digest before FAQ correction')
          manifest = manifest.replace(old_pages_sha, new_pages_sha, 1)
          manifest_path.write_text(manifest, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          css_anchor = '.group-page-content>.rich-content strong{color:#323b47}\n'
          css_insert = (
              css_anchor
              + '.group-page-content>.rich-content .faq-question{margin:22px 0 8px;color:#323b47;font-size:18px;font-weight:700;line-height:1.55}\n'
              + '.group-page-content>.rich-content .faq-question:first-child{margin-top:0}\n'
          )
          if css.count(css_anchor) != 1 or '.faq-question{' in css:
              raise SystemExit('Unexpected FAQ CSS baseline')
          css = css.replace(css_anchor, css_insert, 1)
          mobile_anchor = '  .group-page-content>.rich-content{padding:12px 0 24px;font-size:15px;line-height:1.65}\n'
          if css.count(mobile_anchor) != 1:
              raise SystemExit('Unexpected mobile grouped Page CSS baseline')
          css = css.replace(mobile_anchor, mobile_anchor + '  .group-page-content>.rich-content .faq-question{font-size:17px}\n', 1)
          css_path.write_text(css, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          marker = "test('FAQ Page promotes its ten top-level questions above answer numbering'"
          if marker in test:
              raise SystemExit('FAQ heading regression test already exists unexpectedly')
          test += '''\n\ntest('FAQ Page promotes its ten top-level questions above answer numbering', async ({ page }) => {\n  await page.goto('/page/guide/faq')\n\n  const questions = page.locator('.rich-content h2.faq-question')\n  await expect(questions).toHaveCount(10)\n  await expect(questions.nth(2)).toHaveText('3.可免费申请书面认证报告的高等教育学历证书包括哪些？')\n  await expect(questions.nth(3)).toHaveText('4.普通、成人高等教育学历证书认证需要提供哪些材料')\n  await expect(questions.nth(4)).toHaveText('5.自学考试学历证书认证提供哪些材料？')\n\n  await expect(page.locator('.rich-content p').filter({ hasText: '1、毕业证原件' }).first()).toBeVisible()\n})\n'''
          test_path.write_text(test, encoding='utf-8')

          print(f'EU52 FAQ correction prepared; pages sha256={pages_sha}')
          PY

          git diff --check
          git diff -- sites/jilinjobs/structure/pages.json sites/jilinjobs/manifest.json frontend/public-site/src/sites/main/styles/public-pages.css frontend/public-site/tests/e2e/main-page-formal-content.spec.ts

      - name: Commit bounded correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/jilinjobs/structure/pages.json sites/jilinjobs/manifest.json frontend/public-site/src/sites/main/styles/public-pages.css frontend/public-site/tests/e2e/main-page-formal-content.spec.ts
          git rm .github/workflows/eu52-faq-heading-fix.yml
          git commit -m "fix(eu52): promote FAQ question hierarchy"
          git push origin HEAD:feature/eu-52-main-page-package-adoption
