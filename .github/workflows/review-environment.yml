name: 人工评审环境

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的提交或分支
        required: false
        default: main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: review-environment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  review-environment:
    name: 启动人工评审环境
    if: github.event.action != 'labeled' || github.event.label.name == 'human-review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 构建 Backend / Public Site / Admin
        run: |
          (cd backend && gradle clean bootJar --no-daemon) & backend_build_pid=$!
          (cd frontend/public-site && npm install --no-audit --no-fund && npm run build) & public_build_pid=$!
          (cd frontend/admin && npm install --no-audit --no-fund && npm run build) & admin_build_pid=$!
          wait "$backend_build_pid"
          wait "$public_build_pid"
          wait "$admin_build_pid"

      - name: 准备初始化静态资源包
        run: |
          sudo rm -rf runtime-static runtime-uploads
          mkdir -p runtime-static runtime-uploads
          cp -a site-baseline/static/. runtime-static/
          test -f runtime-static/health/baseline.png
          test -f runtime-static/home/header-banner.png
          test -f runtime-static/home/carousel-01.jpg
          test -f runtime-static/home/recruitment-campaign.png
          test -f runtime-static/brand/smartedu-logo-text.png
          test -f runtime-static/brand/site-favicon.png
          test -f runtime-static/party/ic-title-yellow.png
          test -f runtime-static/party/section-marker.png
          test -f runtime-static/party/party-header-banner.jpg
          test -f runtime-static/footer/public-security-record.png
          test -f runtime-static/footer/public-institution.png
          test -f runtime-static/footer/wechat-qr.png

      - name: 启动 Backend 与双前端 Gateway
        run: |
          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/static-baseline \
            -e CMS_STORAGE_ROOT=/uploads \
            -v "$GITHUB_WORKSPACE/backend/build/libs:/app:ro" \
            -v "$GITHUB_WORKSPACE/runtime-static:/static-baseline" \
            -v "$GITHUB_WORKSPACE/runtime-uploads:/uploads" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done

          docker run -d --name cms-frontend --network host \
            -v "$GITHUB_WORKSPACE/frontend/public-site/dist:/usr/share/nginx/html/public:ro" \
            -v "$GITHUB_WORKSPACE/frontend/admin/dist:/usr/share/nginx/html/admin:ro" \
            -v "$GITHUB_WORKSPACE/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29.8-alpine

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ | grep -qi '<html' \
              && curl --fail --silent http://127.0.0.1:5173/admin/ | grep -qi '<html'; then exit 0; fi
            sleep 1
          done
          docker logs cms-frontend
          exit 1

      - name: 执行 AI / Browser 评审验证
        timeout-minutes: 15
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -e CI_EXTERNAL_WEB_SERVER=true \
            -v "$GITHUB_WORKSPACE/frontend/public-site:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm install --no-audit --no-fund && npx playwright test --project=chromium'

          if compgen -G 'frontend/admin/tests/e2e/*.spec.ts' > /dev/null; then
            docker run --rm --init --ipc=host --network host \
              -e CI=true \
              -v "$GITHUB_WORKSPACE/frontend/admin:/work" \
              -w /work \
              mcr.microsoft.com/playwright:v1.61.0-noble \
              bash -lc 'npm install --no-audit --no-fund && npm run test:e2e'
          fi

          curl --fail --silent http://127.0.0.1:5173/api/admin/columns | jq --exit-status 'length > 0' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/admin/navigations | jq --exit-status 'length > 0' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/admin/page-groups | jq --exit-status 'map(.alias) | index("guide") != null and index("jobs") != null' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/home/header-banner.png > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/party/party-header-banner.jpg > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/brand/site-favicon.png > /dev/null
          curl --fail --silent http://127.0.0.1:5173/admin/articles | grep -qi '<html'

      - name: 上传 AI 评审证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-environment-playwright-evidence
          path: |
            frontend/public-site/playwright-report
            frontend/public-site/test-results
            frontend/admin/playwright-report
            frontend/admin/test-results
          if-no-files-found: warn
          retention-days: 5

      - name: 重置为干净人工评审基线
        run: |
          set -euo pipefail
          docker rm -f cms-backend || true
          docker run --rm --network host mysql:8.4 \
            mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot -e 'DROP DATABASE IF EXISTS jilinjobs_cms; CREATE DATABASE jilinjobs_cms CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;'

          sudo rm -rf runtime-static runtime-uploads
          mkdir -p runtime-static runtime-uploads
          cp -a site-baseline/static/. runtime-static/

          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/static-baseline \
            -e CMS_STORAGE_ROOT=/uploads \
            -v "$GITHUB_WORKSPACE/backend/build/libs:/app:ro" \
            -v "$GITHUB_WORKSPACE/runtime-static:/static-baseline" \
            -v "$GITHUB_WORKSPACE/runtime-uploads:/uploads" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:5173/api/public/navigations \
            | jq --exit-status '[.[] | select(.position == "MAIN" and .parentId == null) | .name] == ["网站首页","中心党建","招聘信息","业务指南","政策法规","就业指导","典型事迹","预决算公开","关于我们"]' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/home/header-banner.png > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/party/party-header-banner.jpg > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/brand/site-favicon.png > /dev/null
          test "$(find runtime-static -maxdepth 1 -type d -name 'verification-*' | wc -l)" -eq 0

      - name: 导入 Party canonical 历史数据
        run: |
          set -euo pipefail
          canonical_root="$GITHUB_WORKSPACE/data-migrations/party/v1"
          test -f "$canonical_root/manifest.json"
          test -f "$canonical_root/index.ndjson"
          test -f "$canonical_root/lists/PARTY_CAROUSEL/index.json"
          jq --exit-status '
            (.status == "accepted-canonical" or .status == "candidate-extension")
            and (if .status == "candidate-extension" then
              .candidateExtension.status == "pending-human-review"
              and .candidateExtension.acceptedEu29Articles == .acceptedSnapshot.articles
              and .candidateExtension.runtimeDatasetArticles == (.acceptedSnapshot.articles + .candidateExtension.addedArticles)
              and .candidateExtension.reportedTotal == .candidateExtension.addedArticles
              and .candidateExtension.unresolved == 0
            else true end)
            and .acceptedSnapshot.articles == 181
            and .acceptedSnapshot.internalArticles == 120
            and .acceptedSnapshot.externalArticles == 61
            and .acceptedSnapshot.carouselItems == 4
            and .acceptedSnapshot.unresolved == 0
            and .acceptedSnapshot.artifactDigest == "sha256:230ac0df997b3dc913ed38503a8289eae30d8bb0a455fd858e388ddc27066148"' "$canonical_root/manifest.json" > /dev/null

          export DB_URL='jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true'
          export DB_USERNAME=root
          export DB_PASSWORD=root
          export CMS_STORAGE_ROOT="$GITHUB_WORKSPACE/runtime-uploads"
          export CMS_STATIC_ROOT="$GITHUB_WORKSPACE/runtime-static"

          (cd backend && gradle importPartyHistoricalContent --args="../data-migrations/party/v1" --no-daemon) | tee eu29-review-article-import.log
          (cd backend && gradle importPartyCarousel --args="../data-migrations/party/v1" --no-daemon) | tee eu29-review-carousel-import.log

          python3 - <<'PY'
          import json, re
          from pathlib import Path
          manifest=json.loads(Path('data-migrations/party/v1/manifest.json').read_text(encoding='utf-8'))
          expected=manifest['acceptedSnapshot']
          runtime_articles=manifest.get('candidateExtension', {}).get('runtimeDatasetArticles', expected['articles'])
          article=json.loads(re.findall(r'EU29_IMPORT_REPORT (\{.*\})', Path('eu29-review-article-import.log').read_text(encoding='utf-8'))[-1])
          assert article['total']==runtime_articles and article['created']==runtime_articles, article
          assert article['skipped']==0 and article['conflicts']==0 and article['invalid']==0, article
          carousel=json.loads(re.findall(r'EU29_CAROUSEL_IMPORT_REPORT (\{.*\})', Path('eu29-review-carousel-import.log').read_text(encoding='utf-8'))[-1])
          assert carousel['total']==expected['carouselItems'] and carousel['created']==expected['carouselItems'], carousel
          assert carousel['updated']==0 and carousel['skipped']==0 and carousel['conflicts']==0 and carousel['invalid']==0, carousel
          PY

          docker run --rm --network host mysql:8.4 \
            mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot jilinjobs_cms -N -B -e \
            "SELECT c.alias,COUNT(a.id) FROM cms_column c LEFT JOIN cms_article a ON a.column_id=c.id AND a.status='PUBLISHED' WHERE c.parent_id=(SELECT id FROM cms_column WHERE alias='party') GROUP BY c.alias ORDER BY c.alias" \
            | tee eu29-review-column-counts.tsv
          node - <<'NODE'
          const fs=require('fs')
          const manifest=require('./data-migrations/party/v1/manifest.json')
          const expected=Object.fromEntries(manifest.contentScope.map(scope=>[scope.columnAlias,scope.observedListCount]))
          const rows=fs.readFileSync('eu29-review-column-counts.tsv','utf8').trim().split(/\n/).map(line=>line.split('\t'))
          if (rows.length !== Object.keys(expected).length) throw new Error(`Party column rows=${rows.length}`)
          for (const [alias,count] of rows) if (Number(count)!==expected[alias]) throw new Error(`${alias}: ${count} != ${expected[alias]}`)
          NODE

      - name: 准备 Human Review 主站示例内容
        run: |
          set -euo pipefail
          columns=$(curl --fail --silent http://127.0.0.1:5173/api/admin/columns)
          notice_id=$(echo "$columns" | jq -r '.[] | select(.alias == "notice") | .id' | head -1)
          employment_id=$(echo "$columns" | jq -r '.[] | select(.alias == "employment-news") | .id' | head -1)
          recruitment_id=$(echo "$columns" | jq -r '.[] | select(.alias == "recruitment-announcement") | .id' | head -1)
          test -n "$notice_id"; test -n "$employment_id"; test -n "$recruitment_id"

          create_article() {
            column_id="$1"; title="$2"; published="$3"; source="${4:-Human Admin Review Fixture}"
            payload=$(jq -n --argjson columnId "$column_id" --arg title "$title" --arg published "$published" --arg source "$source" '{columnId:$columnId,title:$title,bodyHtml:"<p>人工评审示例内容，用于验证编辑、发布与公开展示闭环。</p>",source:$source,publishDate:$published,pinned:false,recommended:false,sortOrder:0,coverResourceId:null,bodyImageResourceIds:[],attachmentResourceIds:[]}')
            article_id=$(curl --fail --silent -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:5173/api/admin/articles | jq -r '.id')
            curl --fail --silent -X POST "http://127.0.0.1:5173/api/admin/articles/${article_id}/publish" > /dev/null
          }

          create_external_article() {
            column_id="$1"; title="$2"; published="$3"; url="$4"; source="${5:-外部招聘信息源}"
            payload=$(jq -n --argjson columnId "$column_id" --arg title "$title" --arg published "$published" --arg url "$url" --arg source "$source" '{columnId:$columnId,title:$title,bodyHtml:"",source:$source,articleType:"EXTERNAL_LINK",externalUrl:$url,publishDate:$published,pinned:false,recommended:false,sortOrder:0,coverResourceId:null,bodyImageResourceIds:[],attachmentResourceIds:[]}')
            article_id=$(curl --fail --silent -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:5173/api/admin/articles | jq -r '.id')
            curl --fail --silent -X POST "http://127.0.0.1:5173/api/admin/articles/${article_id}/publish" > /dev/null
          }

          create_article "$notice_id" '管理端人工评审：就业服务工作通知' '2026-08-28'
          create_article "$notice_id" '管理端人工评审：毕业生就业手续办理提示' '2026-08-26'
          create_article "$employment_id" '管理端人工评审：访企拓岗促就业专项行动' '2026-08-27'
          create_external_article "$recruitment_id" '管理端人工评审：高校毕业生专场招聘公告' '2026-08-28' 'https://example.com/review/recruitment-1'
          create_external_article "$recruitment_id" '管理端人工评审：重点单位招聘公告' '2026-08-24' 'https://example.com/review/recruitment-2'
          
          # 显式人工评审数据，使主站也能观察多项自动/手动切换。
          home_list_id=$(curl --fail --silent http://127.0.0.1:5173/api/admin/lists | jq --exit-status '.[] | select(.code == "HOME_CAROUSEL") | .id')
          for position in 1 2; do
            payload=$(jq -n --argjson position "$position" '{sourceType:"LINK",articleId:null,title:("主站轮播人工评审示例 " + ($position|tostring)),subtitle:null,url:"/column/notice",imagePath:(if $position == 1 then "/static/home/carousel-01.jpg" else "/static/home/recruitment-campaign.png" end),imageResourceId:null,openMode:"SAME_WINDOW",sortOrder:(-100 + $position),enabled:true,extraJson:null}')
            curl --fail --silent -H 'Content-Type: application/json' -d "$payload" "http://127.0.0.1:5173/api/admin/lists/$home_list_id/items" | jq --exit-status '.id > 0' > /dev/null
          done

      - name: 验证 Human Review Runtime 数据
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:5173/admin/articles | grep -qi '<html'
          curl --fail --silent http://127.0.0.1:5173/party/ | grep -qi '<html'
          cat > review-party-runtime.py <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import urlopen
          
          base = sys.argv[1].rstrip('/')
          root = Path('data-migrations/party/v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          
          def read(path):
              assert path.startswith('/') and not path.startswith('//'), path
              with urlopen(base + path, timeout=30) as response:
                  assert urlsplit(response.url).netloc == urlsplit(base).netloc, response.url
                  return response.read()
          
          def get(path):
              return json.loads(read(path))
          
          aliases = ['party'] + [scope['columnAlias'] for scope in manifest['contentScope']]
          columns = {alias: get('/api/public/columns/by-alias/' + alias) for alias in aliases}
          counts = {}
          for scope in manifest['contentScope']:
              alias = scope['columnAlias']
              column = columns[alias]
              assert column['parentId'] == columns['party']['id'], column
              result = get(f"/api/public/articles?columnId={column['id']}&page=0&size=1")
              assert result['total'] == scope['observedListCount'], (alias, result['total'])
              counts[alias] = result['total']
          
          carousel_root = root / 'lists/PARTY_CAROUSEL'
          index = json.loads((carousel_root / 'index.json').read_text(encoding='utf-8'))
          expected = [json.loads((carousel_root / ref['path']).read_text(encoding='utf-8'))
                      for ref in sorted(index['items'], key=lambda ref: ref['sourceOrder'])]
          carousel = get('/api/public/lists/by-code/PARTY_CAROUSEL')
          assert carousel['imagePolicy'] == 'REQUIRED', carousel
          items = carousel['items']
          assert len(items) == len(expected) == manifest['acceptedSnapshot']['carouselItems'], items
          evidence = []
          for item, source in zip(items, expected):
              source_type = source.get('sourceType', 'LINK')
              assert item['sourceType'] == source_type, item
              assert item['title'] == source['title'], item
              assert item['sortOrder'] == source['sourceOrder'], item
              assert item['openMode'] == source['openMode'] == 'NEW_WINDOW', item
              if source_type == 'ARTICLE':
                  assert item['articleId'] and item['effectiveImageResourceId'], item
                  assert item['imageResourceId'] == item['effectiveImageResourceId'], item
                  assert item['imagePath'] is None and item['url'] is None, item
                  assert item['articleType'] == 'INTERNAL' and item['articleStatus'] == 'PUBLISHED', item
                  article = get(f"/api/public/articles/{item['articleId']}")
                  assert article['columnId'] == columns['party-theme-education']['id'], article
                  assert article['title'] == source['title'], article
                  image_path = f"/api/public/resources/{item['effectiveImageResourceId']}/content"
              else:
                  assert item['articleId'] is None and item['effectiveImageResourceId'] is None, item
                  assert item['url'] == source['url'], item
                  image_path = item['imagePath']
                  assert image_path.startswith('/static/migrated/party/carousel/'), item
              content = read(image_path)
              assert len(content) == source['image']['sizeBytes'], image_path
              digest = hashlib.sha256(content).hexdigest()
              assert digest == source['image']['sha256'], (image_path, digest)
              evidence.append({'position': source['sourceOrder'], 'sourceType': source_type,
                               'articleId': item['articleId'], 'imageResourceId': item['effectiveImageResourceId'],
                               'imageSha256': digest})
          
          print(json.dumps({'base': base, 'status': manifest['status'], 'columns': counts,
                            'carousel': evidence}, ensure_ascii=False))
          PY
          python3 review-party-runtime.py http://127.0.0.1:5173 | tee eu30-review-runtime.json

      - name: 执行 Party canonical Runtime Browser 验证
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -e CI_EXTERNAL_WEB_SERVER=true \
            -e PARTY_MIGRATION_RUNTIME=true \
            -v "$GITHUB_WORKSPACE/frontend/public-site:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npx playwright test tests/e2e/party-migration-runtime.spec.ts --project=chromium --reporter=line'

      - name: 上传 Party canonical Human Review 证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: party-canonical-human-review-evidence
          path: |
            data-migrations/party/v1/manifest.json
            data-migrations/party/v1/index.ndjson
            data-migrations/party/v1/reports/canonical-promotion.json
            eu29-review-article-import.log
            eu29-review-carousel-import.log
            eu29-review-column-counts.tsv
            eu30-review-runtime.json
            frontend/public-site/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: 下载 frpc
        run: |
          FRP_VERSION=0.61.1
          mkdir -p frp
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz
          tar -xzf frp_${FRP_VERSION}_linux_amd64.tar.gz
          cp frp_${FRP_VERSION}_linux_amd64/frpc frp/frpc
          chmod +x frp/frpc
          test -x frp/frpc

      - name: 配置 frpc
        run: |
          cat > frp/frpc.toml <<EOF
          serverAddr = "frps.cc-lotus.info"
          serverPort = 7000

          [[proxies]]
          name = "jilinjobs-review"
          type = "http"
          localIP = "127.0.0.1"
          localPort = 5173
          customDomains = ["review.cc-lotus.info"]
          EOF

      - name: 启动 frpc 并验证隧道
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            rm -f frpc.log
            ./frp/frpc -c ./frp/frpc.toml > frpc.log 2>&1 &
            FRPC_PID=$!
            sleep 5
            if kill -0 "$FRPC_PID" 2>/dev/null && grep -q "start proxy success" frpc.log; then
              echo "frpc 隧道已建立"
              exit 0
            fi
            cat frpc.log
            kill "$FRPC_PID" 2>/dev/null || true
            wait "$FRPC_PID" 2>/dev/null || true
            if grep -q "already exists" frpc.log && [ "$attempt" -lt 6 ]; then
              echo "固定评审代理尚未从上一实例释放，5 秒后重试（${attempt}/6）"
              sleep 5
              continue
            fi
            echo "frpc 隧道未建立"
            exit 1
          done
          echo "frpc 隧道重试耗尽"
          exit 1

      - name: 验证外部公开站与管理端地址
        run: |
          for i in $(seq 1 30); do
            if curl --fail --show-error --silent http://review.cc-lotus.info/ -o review-home.html \
              && curl --fail --show-error --silent http://review.cc-lotus.info/party/ -o review-party.html \
              && curl --fail --show-error --silent http://review.cc-lotus.info/admin/ -o review-admin.html \
              && grep -qi '<html' review-home.html \
              && grep -qi '<html' review-party.html \
              && grep -qi '<html' review-admin.html; then break; fi
            if [ "$i" -eq 30 ]; then echo "评审地址验证失败"; cat frpc.log; exit 1; fi
            sleep 2
          done
          grep -q '<title>中心党建</title>' review-party.html
          grep -q '<title>吉林省高等学校毕业生就业信息网</title>' review-home.html
          grep -q '内容管理' review-admin.html
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/home/header-banner.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/party/party-header-banner.jpg > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/brand/site-favicon.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/footer/public-institution.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/footer/wechat-qr.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/api/admin/columns | jq --exit-status 'length > 0' > /dev/null
          python3 review-party-runtime.py http://review.cc-lotus.info | tee eu30-review-external-runtime.json

      - name: 记录评审环境归属与租约
        env:
          REVIEW_EVENT: ${{ github.event_name }}
          REVIEW_ACTION: ${{ github.event.action }}
          REVIEW_LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          export REVIEW_HEAD_SHA=$(git rev-parse HEAD)
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          human = os.environ['REVIEW_EVENT'] == 'workflow_dispatch' or (
              os.environ['REVIEW_ACTION'] == 'labeled' and os.environ['REVIEW_LABEL'] == 'human-review')
          seconds = 2700 if human else 120
          now = datetime.datetime.now(datetime.timezone.utc)
          owner = {'runId': os.environ['GITHUB_RUN_ID'], 'headSha': os.environ['REVIEW_HEAD_SHA'],
                   'mode': 'human-review' if human else 'verification',
                   'readyAt': now.isoformat(), 'expiresAt': (now + datetime.timedelta(seconds=seconds)).isoformat()}
          Path('frontend/public-site/dist/review-environment.json').write_text(json.dumps(owner), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'REVIEW_LEASE_SECONDS={seconds}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Review owner: {json.dumps(owner)}\n\n公开站：http://review.cc-lotus.info/\n\n中心党建：http://review.cc-lotus.info/party/\n\n管理端：http://review.cc-lotus.info/admin/\n")
          print(json.dumps(owner))
          PY
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors             http://review.cc-lotus.info/review-environment.json -o review-external-owner.json
          cmp frontend/public-site/dist/review-environment.json review-external-owner.json

      - name: 上传外部访问与租约证据
        uses: actions/upload-artifact@v7
        with:
          name: review-external-runtime-evidence
          path: |
            eu30-review-external-runtime.json
            review-external-owner.json
          if-no-files-found: error
          retention-days: 7

      - name: 输出评审地址
        run: |
          echo "公开站人工评审地址：http://review.cc-lotus.info/"
          echo "中心党建人工评审地址：http://review.cc-lotus.info/party/"
          echo "管理端人工评审地址：http://review.cc-lotus.info/admin/"
          echo "中心党建：使用仓库 EU-29 accepted 基线及 EU-30 待人工评审增量；主站其他栏目继续使用人工评审示例数据。"

      - name: 保持环境运行
        run: |
          sleep "$REVIEW_LEASE_SECONDS"

      - name: 清理环境
        if: always()
        run: |
          docker rm -f cms-backend cms-frontend || true
          pkill -f '/frp/frpc' || true
