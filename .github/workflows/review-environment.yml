name: 人工评审环境

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的提交或分支
        required: false
        default: main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review-environment:
    name: 启动人工评审环境
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: 构建评审环境
        run: |
          (cd backend && gradle clean bootJar --no-daemon) &
          backend_build_pid=$!
          (cd frontend && npm install --no-audit --no-fund && npm run build) &
          frontend_build_pid=$!
          wait "$backend_build_pid"
          wait "$frontend_build_pid"

      - name: 启动后端与前端
        run: |
          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -v "$GITHUB_WORKSPACE/backend/build/libs:/app:ro" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs cms-backend
              exit 1
            fi
            sleep 2
          done

          docker run -d --name cms-frontend --network host \
            -v "$GITHUB_WORKSPACE/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$GITHUB_WORKSPACE/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29.8-alpine

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ | grep -qi '<html'; then
              exit 0
            fi
            sleep 1
          done
          docker logs cms-frontend
          exit 1

      - name: 生成并验证 AI 评审数据
        timeout-minutes: 10
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -e CI_EXTERNAL_WEB_SERVER=true \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm install --no-audit --no-fund && npx playwright test --project=chromium'

          curl --fail --silent http://127.0.0.1:5173/api/admin/columns \
            | jq --exit-status 'length > 0' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/admin/navigations \
            | jq --exit-status 'length > 0' > /dev/null
          curl --fail --silent 'http://127.0.0.1:5173/api/public/articles?page=0&size=10' \
            | jq --exit-status '.total > 0 and (.items | length > 0)' > /dev/null

      - name: 上传 AI 评审证据
        uses: actions/upload-artifact@v7
        with:
          name: review-environment-playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 5

      - name: 下载 frpc
        run: |
          FRP_VERSION=0.61.1
          mkdir -p frp
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz
          tar -xzf frp_${FRP_VERSION}_linux_amd64.tar.gz
          cp frp_${FRP_VERSION}_linux_amd64/frpc frp/frpc
          chmod +x frp/frpc
          test -x frp/frpc

      - name: 配置 frpc
        run: |
          cat > frp/frpc.toml <<EOF
          serverAddr = "frps.cc-lotus.info"
          serverPort = 7000

          [[proxies]]
          name = "jilinjobs-review"
          type = "http"
          localIP = "127.0.0.1"
          localPort = 5173
          customDomains = ["review.cc-lotus.info"]
          EOF

      - name: 启动 frpc 并验证隧道
        run: |
          test -x ./frp/frpc
          ./frp/frpc -c ./frp/frpc.toml > frpc.log 2>&1 &
          FRPC_PID=$!
          sleep 10

          if ! kill -0 $FRPC_PID; then
            cat frpc.log
            exit 1
          fi

          if ! grep -q "start proxy success" frpc.log; then
            cat frpc.log
            echo "frpc 隧道未建立"
            exit 1
          fi

      - name: 验证外部评审地址
        run: |
          for i in $(seq 1 30); do
            if curl --fail --show-error --silent http://review.cc-lotus.info/ -o review-home.html \
              && grep -qi '<html' review-home.html; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "评审地址验证失败"
              exit 1
            fi
            sleep 2
          done

          grep -q '<title>吉林省高等学校毕业生就业信息网</title>' review-home.html
          js_path=$(grep -oE 'src="/assets/[^"]+\.js"' review-home.html | head -1 | cut -d'"' -f2)
          css_path=$(grep -oE 'href="/assets/[^"]+\.css"' review-home.html | head -1 | cut -d'"' -f2)
          test -n "$js_path"
          test -n "$css_path"

          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors \
            "http://review.cc-lotus.info${js_path}" > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors \
            "http://review.cc-lotus.info${css_path}" > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors \
            http://review.cc-lotus.info/admin/articles | grep -qi '<html'
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors \
            'http://review.cc-lotus.info/api/public/articles?page=0&size=10' \
            | jq --exit-status '.total > 0 and (.items | length > 0)'

      - name: 输出评审地址
        run: |
          echo "人工评审地址：http://review.cc-lotus.info"

      - name: 保持环境运行
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sleep 120
          else
            sleep 3300
          fi

      - name: 清理环境
        if: always()
        run: |
          docker rm -f cms-backend cms-frontend || true
          pkill -f '/frp/frpc' || true
