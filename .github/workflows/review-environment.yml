name: 人工评审环境

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的提交或分支
        required: false
        default: main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-environment-${{ github.event.pull_request.number || github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  review-environment:
    name: 启动人工评审环境
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: 构建评审环境
        run: |
          (cd backend && gradle clean bootJar --no-daemon) &
          backend_build_pid=$!
          (cd frontend && npm install --no-audit --no-fund && npm run build) &
          frontend_build_pid=$!
          wait "$backend_build_pid"
          wait "$frontend_build_pid"

      - name: 准备初始化静态资源包
        run: |
          sudo rm -rf runtime-static
          mkdir -p runtime-static
          cp -a site-baseline/static/. runtime-static/
          test -f runtime-static/health/baseline.png
          test -f runtime-static/home/header-banner.png
          test -f runtime-static/home/carousel-01.jpg
          test -f runtime-static/home/recruitment-campaign.png
          test -f runtime-static/brand/smartedu-logo-text.png

      - name: 启动后端与前端
        run: |
          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/static-baseline \
            -v "$GITHUB_WORKSPACE/backend/build/libs:/app:ro" \
            -v "$GITHUB_WORKSPACE/runtime-static:/static-baseline" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8080/static/health/baseline.png > /dev/null

          docker run -d --name cms-frontend --network host \
            -v "$GITHUB_WORKSPACE/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$GITHUB_WORKSPACE/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29.8-alpine

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ | grep -qi '<html'; then exit 0; fi
            sleep 1
          done
          docker logs cms-frontend
          exit 1

      - name: 生成并验证 AI 评审数据
        timeout-minutes: 10
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -e CI_EXTERNAL_WEB_SERVER=true \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm install --no-audit --no-fund && npx playwright test --project=chromium'

          curl --fail --silent http://127.0.0.1:5173/api/admin/columns | jq --exit-status 'length > 0' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/admin/navigations | jq --exit-status 'length > 0' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/admin/page-groups | jq --exit-status 'map(.alias) | index("guide") != null and index("jobs") != null' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/home/header-banner.png > /dev/null

      - name: 上传 AI 评审证据
        uses: actions/upload-artifact@v7
        with:
          name: review-environment-playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 5

      - name: 重置为干净人工评审基线
        run: |
          set -euo pipefail
          docker rm -f cms-backend || true
          docker run --rm --network host mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot -e 'DROP DATABASE IF EXISTS jilinjobs_cms; CREATE DATABASE jilinjobs_cms CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;'

          sudo rm -rf runtime-static
          mkdir -p runtime-static
          cp -a site-baseline/static/. runtime-static/

          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/static-baseline \
            -v "$GITHUB_WORKSPACE/backend/build/libs:/app:ro" \
            -v "$GITHUB_WORKSPACE/runtime-static:/static-baseline" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:5173/api/public/navigations \
            | jq --exit-status '[.[] | select(.position == "MAIN" and .parentId == null) | .name] == ["网站首页","中心党建","招聘信息","业务指南","政策法规","就业指导","典型事迹","预决算公开","关于我们"]' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/public/navigations \
            | jq --exit-status 'all(.[]; (.name | startswith("移动导航-") | not) and (.name | startswith("外部服务-") | not))' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/home/header-banner.png > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/home/carousel-01.jpg > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/home/recruitment-campaign.png > /dev/null

      - name: 准备人工评审示例内容
        run: |
          set -euo pipefail
          columns=$(curl --fail --silent http://127.0.0.1:5173/api/admin/columns)
          notice_id=$(echo "$columns" | jq -r '.[] | select(.alias == "notice") | .id' | head -1)
          employment_id=$(echo "$columns" | jq -r '.[] | select(.alias == "employment-news") | .id' | head -1)
          recruitment_id=$(echo "$columns" | jq -r '.[] | select(.alias == "recruitment-announcement") | .id' | head -1)
          test -n "$notice_id"; test -n "$employment_id"; test -n "$recruitment_id"

          create_article() {
            column_id="$1"; title="$2"; published="$3"
            payload=$(jq -n --argjson columnId "$column_id" --arg title "$title" --arg published "$published" '{columnId:$columnId,title:$title,bodyHtml:"<p>人工评审环境示例内容，用于观察页面排版与视觉效果。</p>",source:"人工评审示例数据",publishDate:$published,pinned:false,recommended:false,sortOrder:0,coverResourceId:null,bodyImageResourceIds:[],attachmentResourceIds:[]}')
            article_id=$(curl --fail --silent -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:5173/api/admin/articles | jq -r '.id')
            curl --fail --silent -X POST "http://127.0.0.1:5173/api/admin/articles/${article_id}/publish" > /dev/null
          }

          create_external_article() {
            column_id="$1"; title="$2"; published="$3"; url="$4"
            payload=$(jq -n --argjson columnId "$column_id" --arg title "$title" --arg published "$published" --arg url "$url" '{columnId:$columnId,title:$title,bodyHtml:"",source:"外部招聘信息源",articleType:"EXTERNAL_LINK",externalUrl:$url,publishDate:$published,pinned:false,recommended:false,sortOrder:0,coverResourceId:null,bodyImageResourceIds:[],attachmentResourceIds:[]}')
            article_id=$(curl --fail --silent -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:5173/api/admin/articles | jq -r '.id')
            curl --fail --silent -X POST "http://127.0.0.1:5173/api/admin/articles/${article_id}/publish" > /dev/null
          }

          create_article "$notice_id" '关于开展高校毕业生就业服务相关工作的通知' '2026-08-28'
          create_article "$notice_id" '吉林省高校毕业生就业创业服务工作安排' '2026-08-26'
          create_article "$notice_id" '关于做好毕业生就业手续办理工作的提示' '2026-08-22'
          create_article "$notice_id" '高校毕业生就业政策宣传活动通知' '2026-08-18'
          create_article "$notice_id" '就业服务大厅近期业务办理温馨提示' '2026-08-15'

          create_article "$employment_id" '吉林省高校持续开展访企拓岗促就业专项行动' '2026-08-27'
          create_article "$employment_id" '高校毕业生就业服务系列活动有序开展' '2026-08-25'
          create_article "$employment_id" '全省高校就业指导服务能力提升活动举办' '2026-08-21'
          create_article "$employment_id" '校企协同拓展毕业生就业岗位资源' '2026-08-19'
          create_article "$employment_id" '重点群体毕业生就业帮扶工作持续推进' '2026-08-16'

          create_external_article "$recruitment_id" '吉林省高校毕业生专场招聘活动公告' '2026-08-28' 'https://example.com/review/recruitment-1'
          create_external_article "$recruitment_id" '长春市重点用人单位高校毕业生招聘公告' '2026-08-24' 'https://example.com/review/recruitment-2'
          create_external_article "$recruitment_id" '吉林省事业单位面向高校毕业生公开招聘信息' '2026-08-20' 'https://example.com/review/recruitment-3'
          create_external_article "$recruitment_id" '高校毕业生线上双选会参会公告' '2026-08-17' 'https://example.com/review/recruitment-4'
          create_external_article "$recruitment_id" '省内重点企业招聘高校毕业生岗位信息' '2026-08-13' 'https://example.com/review/recruitment-5'

          curl --fail --silent 'http://127.0.0.1:5173/api/public/articles?page=0&size=50' | jq --exit-status '.total >= 15' > /dev/null

      - name: 下载 frpc
        run: |
          FRP_VERSION=0.61.1
          mkdir -p frp
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz
          tar -xzf frp_${FRP_VERSION}_linux_amd64.tar.gz
          cp frp_${FRP_VERSION}_linux_amd64/frpc frp/frpc
          chmod +x frp/frpc
          test -x frp/frpc

      - name: 配置 frpc
        run: |
          cat > frp/frpc.toml <<EOF
          serverAddr = "frps.cc-lotus.info"
          serverPort = 7000

          [[proxies]]
          name = "jilinjobs-review"
          type = "http"
          localIP = "127.0.0.1"
          localPort = 5173
          customDomains = ["review.cc-lotus.info"]
          EOF

      - name: 启动 frpc 并验证隧道
        run: |
          test -x ./frp/frpc
          ./frp/frpc -c ./frp/frpc.toml > frpc.log 2>&1 &
          FRPC_PID=$!
          sleep 10
          if ! kill -0 $FRPC_PID; then cat frpc.log; exit 1; fi
          if ! grep -q "start proxy success" frpc.log; then cat frpc.log; echo "frpc 隧道未建立"; exit 1; fi

      - name: 验证外部评审地址
        run: |
          for i in $(seq 1 30); do
            if curl --fail --show-error --silent http://review.cc-lotus.info/ -o review-home.html && grep -qi '<html' review-home.html; then break; fi
            if [ "$i" -eq 30 ]; then echo "评审地址验证失败"; exit 1; fi
            sleep 2
          done
          grep -q '<title>吉林省高等学校毕业生就业信息网</title>' review-home.html
          js_path=$(grep -oE 'src="/assets/[^"]+\.js"' review-home.html | head -1 | cut -d'"' -f2)
          css_path=$(grep -oE 'href="/assets/[^"]+\.css"' review-home.html | head -1 | cut -d'"' -f2)
          test -n "$js_path"; test -n "$css_path"
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors "http://review.cc-lotus.info${js_path}" > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors "http://review.cc-lotus.info${css_path}" > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/home/header-banner.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors 'http://review.cc-lotus.info/api/public/articles?page=0&size=20' | jq --exit-status '.total >= 15' > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/api/public/navigations \
            | jq --exit-status 'all(.[]; (.name | startswith("移动导航-") | not) and (.name | startswith("外部服务-") | not))' > /dev/null

      - name: 输出评审地址
        run: echo "人工评审地址：http://review.cc-lotus.info"

      - name: 保持环境运行
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then sleep 120; else sleep 3300; fi

      - name: 清理环境
        if: always()
        run: |
          docker rm -f cms-backend cms-frontend || true
          pkill -f '/frp/frpc' || true