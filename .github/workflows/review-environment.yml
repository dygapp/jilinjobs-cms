name: 人工评审环境

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的提交或分支
        required: false
        default: main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-environment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review-environment:
    name: 启动人工评审环境
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 构建 Backend / Public Site / Admin
        run: |
          (cd backend && gradle clean bootJar --no-daemon) & backend_build_pid=$!
          (cd frontend/public-site && npm install --no-audit --no-fund && npm run build) & public_build_pid=$!
          (cd frontend/admin && npm install --no-audit --no-fund && npm run build) & admin_build_pid=$!
          wait "$backend_build_pid"
          wait "$public_build_pid"
          wait "$admin_build_pid"

      - name: 准备初始化静态资源包
        run: |
          sudo rm -rf runtime-static
          mkdir -p runtime-static
          cp -a site-baseline/static/. runtime-static/
          test -f runtime-static/health/baseline.png
          test -f runtime-static/home/header-banner.png
          test -f runtime-static/home/carousel-01.jpg
          test -f runtime-static/home/recruitment-campaign.png
          test -f runtime-static/brand/smartedu-logo-text.png
          test -f runtime-static/brand/site-favicon.png
          test -f runtime-static/party/ic-title-yellow.png
          test -f runtime-static/party/section-marker.png
          test -f runtime-static/party/party-header-banner.jpg
          test -f runtime-static/footer/public-security-record.png
          test -f runtime-static/footer/public-institution.png
          test -f runtime-static/footer/wechat-qr.png

      - name: 启动 Backend 与双前端 Gateway
        run: |
          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/static-baseline \
            -v "$GITHUB_WORKSPACE/backend/build/libs:/app:ro" \
            -v "$GITHUB_WORKSPACE/runtime-static:/static-baseline" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done

          docker run -d --name cms-frontend --network host \
            -v "$GITHUB_WORKSPACE/frontend/public-site/dist:/usr/share/nginx/html/public:ro" \
            -v "$GITHUB_WORKSPACE/frontend/admin/dist:/usr/share/nginx/html/admin:ro" \
            -v "$GITHUB_WORKSPACE/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29.8-alpine

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ | grep -qi '<html' \
              && curl --fail --silent http://127.0.0.1:5173/admin/ | grep -qi '<html'; then exit 0; fi
            sleep 1
          done
          docker logs cms-frontend
          exit 1

      - name: 执行 AI / Browser 评审验证
        timeout-minutes: 15
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -e CI_EXTERNAL_WEB_SERVER=true \
            -v "$GITHUB_WORKSPACE/frontend/public-site:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm install --no-audit --no-fund && npx playwright test --project=chromium'

          if compgen -G 'frontend/admin/tests/e2e/*.spec.ts' > /dev/null; then
            docker run --rm --init --ipc=host --network host \
              -e CI=true \
              -v "$GITHUB_WORKSPACE/frontend/admin:/work" \
              -w /work \
              mcr.microsoft.com/playwright:v1.61.0-noble \
              bash -lc 'npm install --no-audit --no-fund && npm run test:e2e'
          fi

          curl --fail --silent http://127.0.0.1:5173/api/admin/columns | jq --exit-status 'length > 0' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/admin/navigations | jq --exit-status 'length > 0' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/admin/page-groups | jq --exit-status 'map(.alias) | index("guide") != null and index("jobs") != null' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/home/header-banner.png > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/party/party-header-banner.jpg > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/brand/site-favicon.png > /dev/null
          curl --fail --silent http://127.0.0.1:5173/admin/articles | grep -qi '<html'

      - name: 上传 AI 评审证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-environment-playwright-evidence
          path: |
            frontend/public-site/playwright-report
            frontend/public-site/test-results
            frontend/admin/playwright-report
            frontend/admin/test-results
          if-no-files-found: warn
          retention-days: 5

      - name: 重置为干净人工评审基线
        run: |
          set -euo pipefail
          docker rm -f cms-backend || true
          docker run --rm --network host mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot -e 'DROP DATABASE IF EXISTS jilinjobs_cms; CREATE DATABASE jilinjobs_cms CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;'

          sudo rm -rf runtime-static
          mkdir -p runtime-static
          cp -a site-baseline/static/. runtime-static/

          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/static-baseline \
            -v "$GITHUB_WORKSPACE/backend/build/libs:/app:ro" \
            -v "$GITHUB_WORKSPACE/runtime-static:/static-baseline" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:5173/api/public/navigations \
            | jq --exit-status '[.[] | select(.position == "MAIN" and .parentId == null) | .name] == ["网站首页","中心党建","招聘信息","业务指南","政策法规","就业指导","典型事迹","预决算公开","关于我们"]' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/home/header-banner.png > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/party/party-header-banner.jpg > /dev/null
          curl --fail --silent http://127.0.0.1:5173/static/brand/site-favicon.png > /dev/null
          test "$(find runtime-static -maxdepth 1 -type d -name 'verification-*' | wc -l)" -eq 0

      - name: 准备 Human Review 示例内容
        run: |
          set -euo pipefail
          columns=$(curl --fail --silent http://127.0.0.1:5173/api/admin/columns)
          notice_id=$(echo "$columns" | jq -r '.[] | select(.alias == "notice") | .id' | head -1)
          employment_id=$(echo "$columns" | jq -r '.[] | select(.alias == "employment-news") | .id' | head -1)
          recruitment_id=$(echo "$columns" | jq -r '.[] | select(.alias == "recruitment-announcement") | .id' | head -1)
          party_voice_id=$(echo "$columns" | jq -r '.[] | select(.alias == "party-voice") | .id' | head -1)
          party_work_id=$(echo "$columns" | jq -r '.[] | select(.alias == "party-work") | .id' | head -1)
          party_rules_id=$(echo "$columns" | jq -r '.[] | select(.alias == "party-rules") | .id' | head -1)
          party_study_id=$(echo "$columns" | jq -r '.[] | select(.alias == "party-study") | .id' | head -1)
          test -n "$notice_id"; test -n "$employment_id"; test -n "$recruitment_id"
          test -n "$party_voice_id"; test -n "$party_work_id"; test -n "$party_rules_id"; test -n "$party_study_id"

          lists=$(curl --fail --silent http://127.0.0.1:5173/api/admin/lists)
          party_carousel_id=$(echo "$lists" | jq -r '.[] | select(.code == "PARTY_CAROUSEL") | .id' | head -1)
          test -n "$party_carousel_id"

          create_article() {
            column_id="$1"; title="$2"; published="$3"; source="${4:-Human Admin Review Fixture}"
            payload=$(jq -n --argjson columnId "$column_id" --arg title "$title" --arg published "$published" --arg source "$source" '{columnId:$columnId,title:$title,bodyHtml:"<p>人工评审示例内容，用于验证编辑、发布与公开展示闭环；该内容不属于历史迁移数据。</p><p>页面结构、栏目归属和跳转行为应与正式党员之家内容保持一致。</p>",source:$source,publishDate:$published,pinned:false,recommended:false,sortOrder:0,coverResourceId:null,bodyImageResourceIds:[],attachmentResourceIds:[]}')
            article_id=$(curl --fail --silent -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:5173/api/admin/articles | jq -r '.id')
            curl --fail --silent -X POST "http://127.0.0.1:5173/api/admin/articles/${article_id}/publish" > /dev/null
            echo "$article_id"
          }

          create_external_article() {
            column_id="$1"; title="$2"; published="$3"; url="$4"; source="${5:-外部招聘信息源}"
            payload=$(jq -n --argjson columnId "$column_id" --arg title "$title" --arg published "$published" --arg url "$url" --arg source "$source" '{columnId:$columnId,title:$title,bodyHtml:"",source:$source,articleType:"EXTERNAL_LINK",externalUrl:$url,publishDate:$published,pinned:false,recommended:false,sortOrder:0,coverResourceId:null,bodyImageResourceIds:[],attachmentResourceIds:[]}')
            article_id=$(curl --fail --silent -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:5173/api/admin/articles | jq -r '.id')
            curl --fail --silent -X POST "http://127.0.0.1:5173/api/admin/articles/${article_id}/publish" > /dev/null
          }

          create_carousel_item() {
            title="$1"; sort_order="$2"; url="$3"
            payload=$(jq -n --arg title "$title" --arg url "$url" --argjson sortOrder "$sort_order" '{title:$title,subtitle:"人工评审示例（非历史迁移内容）",url:$url,imagePath:"/static/home/carousel-01.jpg",openMode:"DEFAULT",sortOrder:$sortOrder,enabled:true,extraJson:null}')
            curl --fail --silent -H 'Content-Type: application/json' -d "$payload" "http://127.0.0.1:5173/api/admin/lists/${party_carousel_id}/items" > /dev/null
          }

          create_article "$notice_id" '管理端人工评审：就业服务工作通知' '2026-08-28' > /dev/null
          create_article "$notice_id" '管理端人工评审：毕业生就业手续办理提示' '2026-08-26' > /dev/null
          create_article "$employment_id" '管理端人工评审：访企拓岗促就业专项行动' '2026-08-27' > /dev/null
          create_external_article "$recruitment_id" '管理端人工评审：高校毕业生专场招聘公告' '2026-08-28' 'https://example.com/review/recruitment-1'
          create_external_article "$recruitment_id" '管理端人工评审：重点单位招聘公告' '2026-08-24' 'https://example.com/review/recruitment-2'

          party_voice_carousel_article_id=$(create_article "$party_voice_id" '党员之家人工评审示例：深入学习贯彻重要讲话精神' '2026-09-01' '党员之家 Human Review Fixture')
          create_article "$party_voice_id" '党员之家人工评审示例：推动高校党建与就业服务融合发展' '2026-08-31' '党员之家 Human Review Fixture' > /dev/null
          create_article "$party_voice_id" '党员之家人工评审示例：持续加强基层党组织建设' '2026-08-30' '党员之家 Human Review Fixture' > /dev/null
          create_external_article "$party_voice_id" '党员之家人工评审示例外链：共产党员网' '2026-08-29' 'https://www.12371.cn/' '党员之家 Human Review Fixture'

          party_work_carousel_article_id=$(create_article "$party_work_id" '党员之家人工评审示例：中心开展主题党日活动' '2026-09-02' '党员之家 Human Review Fixture')
          create_article "$party_work_id" '党员之家人工评审示例：召开党建工作专题学习会' '2026-09-01' '党员之家 Human Review Fixture' > /dev/null
          create_article "$party_work_id" '党员之家人工评审示例：推进党建业务融合重点任务' '2026-08-31' '党员之家 Human Review Fixture' > /dev/null
          create_article "$party_work_id" '党员之家人工评审示例：开展党员志愿服务活动' '2026-08-30' '党员之家 Human Review Fixture' > /dev/null
          create_article "$party_work_id" '党员之家人工评审示例：基层联系点调研交流' '2026-08-29' '党员之家 Human Review Fixture' > /dev/null
          create_article "$party_work_id" '党员之家人工评审示例：支部集中学习研讨' '2026-08-28' '党员之家 Human Review Fixture' > /dev/null

          party_rules_carousel_article_id=$(create_article "$party_rules_id" '党员之家人工评审示例：党规党章学习资料（一）' '2026-08-27' '党员之家 Human Review Fixture')
          create_article "$party_rules_id" '党员之家人工评审示例：党规党章学习资料（二）' '2026-08-26' '党员之家 Human Review Fixture' > /dev/null
          create_article "$party_rules_id" '党员之家人工评审示例：党规党章学习资料（三）' '2026-08-25' '党员之家 Human Review Fixture' > /dev/null

          party_study_carousel_article_id=$(create_article "$party_study_id" '党员之家人工评审示例：理论学习专题（一）' '2026-08-27' '党员之家 Human Review Fixture')
          create_article "$party_study_id" '党员之家人工评审示例：理论学习专题（二）' '2026-08-26' '党员之家 Human Review Fixture' > /dev/null
          create_article "$party_study_id" '党员之家人工评审示例：理论学习专题（三）' '2026-08-25' '党员之家 Human Review Fixture' > /dev/null

          create_carousel_item '党员之家人工评审示例轮播（一）' 0 "/party/article/${party_voice_carousel_article_id}"
          create_carousel_item '党员之家人工评审示例轮播（二）' 10 "/party/article/${party_work_carousel_article_id}"
          create_carousel_item '党员之家人工评审示例轮播（三）' 20 "/party/article/${party_rules_carousel_article_id}"
          create_carousel_item '党员之家人工评审示例轮播（四）' 30 "/party/article/${party_study_carousel_article_id}"

          curl --fail --silent 'http://127.0.0.1:5173/api/public/articles?page=0&size=50' | jq --exit-status '.total >= 20' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/api/public/lists/by-code/PARTY_CAROUSEL \
            | jq --exit-status '(.items | length == 4) and all(.items[]; (.url // "") | test("^/party/article/[0-9]+$"))' > /dev/null
          curl --fail --silent http://127.0.0.1:5173/admin/articles | grep -qi '<html'
          curl --fail --silent http://127.0.0.1:5173/party/ | grep -qi '<html'

      - name: 下载 frpc
        run: |
          FRP_VERSION=0.61.1
          mkdir -p frp
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz
          tar -xzf frp_${FRP_VERSION}_linux_amd64.tar.gz
          cp frp_${FRP_VERSION}_linux_amd64/frpc frp/frpc
          chmod +x frp/frpc
          test -x frp/frpc

      - name: 配置 frpc
        run: |
          cat > frp/frpc.toml <<EOF
          serverAddr = "frps.cc-lotus.info"
          serverPort = 7000

          [[proxies]]
          name = "jilinjobs-review"
          type = "http"
          localIP = "127.0.0.1"
          localPort = 5173
          customDomains = ["review.cc-lotus.info"]
          EOF

      - name: 启动 frpc 并验证隧道
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            rm -f frpc.log
            ./frp/frpc -c ./frp/frpc.toml > frpc.log 2>&1 &
            FRPC_PID=$!
            sleep 5

            if kill -0 "$FRPC_PID" 2>/dev/null && grep -q "start proxy success" frpc.log; then
              echo "frpc 隧道已建立"
              exit 0
            fi

            cat frpc.log
            kill "$FRPC_PID" 2>/dev/null || true
            wait "$FRPC_PID" 2>/dev/null || true

            if grep -q "already exists" frpc.log && [ "$attempt" -lt 6 ]; then
              echo "固定评审代理尚未从上一实例释放，5 秒后重试（${attempt}/6）"
              sleep 5
              continue
            fi

            echo "frpc 隧道未建立"
            exit 1
          done
          echo "frpc 隧道重试耗尽"
          exit 1

      - name: 验证外部公开站与管理端地址
        run: |
          for i in $(seq 1 30); do
            if curl --fail --show-error --silent http://review.cc-lotus.info/ -o review-home.html \
              && curl --fail --show-error --silent http://review.cc-lotus.info/party/ -o review-party.html \
              && curl --fail --show-error --silent http://review.cc-lotus.info/admin/ -o review-admin.html \
              && grep -qi '<html' review-home.html \
              && grep -qi '<html' review-party.html \
              && grep -qi '<html' review-admin.html; then break; fi
            if [ "$i" -eq 30 ]; then echo "评审地址验证失败"; cat frpc.log; exit 1; fi
            sleep 2
          done
          grep -q '<title>中心党建</title>' review-party.html
          grep -q '<title>吉林省高等学校毕业生就业信息网</title>' review-home.html
          grep -q '内容管理' review-admin.html
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/home/header-banner.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/party/party-header-banner.jpg > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/brand/site-favicon.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/footer/public-institution.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/footer/wechat-qr.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/api/admin/columns | jq --exit-status 'length > 0' > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors 'http://review.cc-lotus.info/api/public/articles?page=0&size=50' | jq --exit-status '.total >= 20' > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/api/public/lists/by-code/PARTY_CAROUSEL \
            | jq --exit-status '(.items | length == 4) and all(.items[]; (.url // "") | test("^/party/article/[0-9]+$"))' > /dev/null

      - name: 输出评审地址
        run: |
          echo "公开站人工评审地址：http://review.cc-lotus.info/"
          echo "中心党建人工评审地址：http://review.cc-lotus.info/party/"
          echo "管理端人工评审地址：http://review.cc-lotus.info/admin/"

      - name: 保持环境运行
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then sleep 120; else sleep 3300; fi

      - name: 清理环境
        if: always()
        run: |
          docker rm -f cms-backend cms-frontend || true
          pkill -f '/frp/frpc' || true
