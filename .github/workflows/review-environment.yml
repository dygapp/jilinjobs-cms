name: 人工评审环境

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的提交或分支
        required: false
        default: main
  pull_request:
    types: [labeled]

concurrency:
  group: review-environment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  review-environment:
    name: 启动人工评审环境
    if: github.event.action != 'labeled' || github.event.label.name == 'human-review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析 verified Review Runtime
        id: runtime-images
        shell: bash
        run: |
          set -euo pipefail
          backend="$(bash scripts/backend-runtime-fingerprint.sh)"
          frontend="$(bash scripts/frontend-runtime-fingerprint.sh)"
          baseline="$(bash scripts/review-baseline-fingerprint.sh)"
          verification="$(bash scripts/review-verification-fingerprint.sh)"

          backend_image="ghcr.io/${{ github.repository }}-backend:$backend"
          frontend_image="ghcr.io/${{ github.repository }}-frontend-runtime:$frontend"
          baseline_image="ghcr.io/${{ github.repository }}-review-baseline:$baseline"
          verification_image="ghcr.io/${{ github.repository }}-review-verification:$verification"

          for image in "$backend_image" "$frontend_image" "$baseline_image" "$verification_image"; do
            if ! docker manifest inspect "$image" >/dev/null 2>manifest.err; then
              cat manifest.err
              echo "目标 Head 缺少 matching verified artifact：$image。请先让对应 inputs 的完整 CI 通过。" >&2
              exit 1
            fi
          done

          docker pull "$backend_image"
          docker pull "$frontend_image"
          docker pull "$baseline_image"
          docker pull "$verification_image"

          marker_id="$(docker create "$verification_image")"
          docker cp "$marker_id:/verification.json" review-verification.json
          docker rm -f "$marker_id" >/dev/null
          jq --exit-status \
            --arg backend "$backend" \
            --arg frontend "$frontend" \
            --arg baseline "$baseline" \
            --arg verification "$verification" \
            '.backendFingerprint == $backend
             and .frontendFingerprint == $frontend
             and .baselineFingerprint == $baseline
             and .verificationFingerprint == $verification' \
            review-verification.json >/dev/null

          test "$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.backend-fingerprint" }}' "$backend_image")" = "$backend"
          test "$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.frontend-runtime-fingerprint" }}' "$frontend_image")" = "$frontend"
          test "$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.review-baseline-fingerprint" }}' "$baseline_image")" = "$baseline"
          test "$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.backend-fingerprint" }}' "$baseline_image")" = "$backend"
          test "$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.backend-fingerprint" }}' "$verification_image")" = "$backend"
          test "$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.frontend-runtime-fingerprint" }}' "$verification_image")" = "$frontend"
          test "$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.review-baseline-fingerprint" }}' "$verification_image")" = "$baseline"
          test "$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.review-verification-fingerprint" }}' "$verification_image")" = "$verification"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "verification=$verification" >> "$GITHUB_OUTPUT"
          echo "producer_sha=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$verification_image")" >> "$GITHUB_OUTPUT"
          echo "backend_image=$backend_image" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"
          echo "baseline_image=$baseline_image" >> "$GITHUB_OUTPUT"

      - name: 恢复 verified Review Data Baseline
        env:
          BASELINE_IMAGE: ${{ steps.runtime-images.outputs.baseline_image }}
          EXPECTED_BASELINE_FINGERPRINT: ${{ steps.runtime-images.outputs.baseline }}
          EXPECTED_BACKEND_FINGERPRINT: ${{ steps.runtime-images.outputs.backend }}
        run: bash scripts/restore-review-baseline.sh

      - name: 启动 verified Review Runtime
        env:
          BACKEND_IMAGE: ${{ steps.runtime-images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.runtime-images.outputs.frontend_image }}
        run: bash scripts/start-review-runtime.sh

      - name: 注入 Human Review fixture
        run: bash scripts/apply-human-review-fixture.sh

      - name: 验证 Human Review Runtime
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:5173/admin/articles | grep -qi '<html'
          curl --fail --silent http://127.0.0.1:5173/party/ | grep -qi '<html'
          curl --fail --silent http://127.0.0.1:5173/static/home/header-banner.png >/dev/null
          curl --fail --silent http://127.0.0.1:5173/static/party/party-header-banner.jpg >/dev/null
          python3 scripts/verify-review-runtime.py http://127.0.0.1:5173 | tee review-local-runtime.json

      - name: 下载 frpc
        run: |
          FRP_VERSION=0.61.1
          mkdir -p frp
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz
          tar -xzf frp_${FRP_VERSION}_linux_amd64.tar.gz
          cp frp_${FRP_VERSION}_linux_amd64/frpc frp/frpc
          chmod +x frp/frpc
          test -x frp/frpc

      - name: 配置 frpc
        run: |
          cat > frp/frpc.toml <<EOF
          serverAddr = "frps.cc-lotus.info"
          serverPort = 7000

          [[proxies]]
          name = "jilinjobs-review"
          type = "http"
          localIP = "127.0.0.1"
          localPort = 5173
          customDomains = ["review.cc-lotus.info"]
          EOF

      - name: 启动 frpc 并验证隧道
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            rm -f frpc.log
            ./frp/frpc -c ./frp/frpc.toml > frpc.log 2>&1 &
            FRPC_PID=$!
            sleep 5
            if kill -0 "$FRPC_PID" 2>/dev/null && grep -q "start proxy success" frpc.log; then
              echo "frpc 隧道已建立"
              exit 0
            fi
            cat frpc.log
            kill "$FRPC_PID" 2>/dev/null || true
            wait "$FRPC_PID" 2>/dev/null || true
            if grep -q "already exists" frpc.log && [ "$attempt" -lt 6 ]; then
              echo "固定评审代理尚未从上一实例释放，5 秒后重试（${attempt}/6）"
              sleep 5
              continue
            fi
            echo "frpc 隧道未建立"
            exit 1
          done
          echo "frpc 隧道重试耗尽"
          exit 1

      - name: 验证外部公开站与管理端地址
        run: |
          for i in $(seq 1 30); do
            if curl --fail --show-error --silent http://review.cc-lotus.info/ -o review-home.html \
              && curl --fail --show-error --silent http://review.cc-lotus.info/party/ -o review-party.html \
              && curl --fail --show-error --silent http://review.cc-lotus.info/admin/ -o review-admin.html \
              && grep -qi '<html' review-home.html \
              && grep -qi '<html' review-party.html \
              && grep -qi '<html' review-admin.html; then break; fi
            if [ "$i" -eq 30 ]; then echo "评审地址验证失败"; cat frpc.log; exit 1; fi
            sleep 2
          done
          grep -q '<title>中心党建</title>' review-party.html
          grep -q '<title>吉林省高等学校毕业生就业信息网</title>' review-home.html
          grep -q '内容管理' review-admin.html
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/home/header-banner.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/party/party-header-banner.jpg > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/brand/site-favicon.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/footer/public-institution.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/static/footer/wechat-qr.png > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/api/admin/columns | jq --exit-status 'length > 0' > /dev/null
          python3 scripts/verify-review-runtime.py http://review.cc-lotus.info | tee review-external-runtime.json

      - name: 记录评审环境归属与租约
        env:
          REVIEW_EVENT: ${{ github.event_name }}
          REVIEW_ACTION: ${{ github.event.action }}
          REVIEW_LABEL: ${{ github.event.label.name }}
          REVIEW_VERIFICATION_FINGERPRINT: ${{ steps.runtime-images.outputs.verification }}
          REVIEW_VERIFICATION_PRODUCER_SHA: ${{ steps.runtime-images.outputs.producer_sha }}
        run: |
          set -euo pipefail
          export REVIEW_HEAD_SHA=$(git rev-parse HEAD)
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          human = os.environ['REVIEW_EVENT'] == 'workflow_dispatch' or (
              os.environ['REVIEW_ACTION'] == 'labeled' and os.environ['REVIEW_LABEL'] == 'human-review')
          seconds = 2700 if human else 120
          now = datetime.datetime.now(datetime.timezone.utc)
          owner = {'runId': os.environ['GITHUB_RUN_ID'], 'headSha': os.environ['REVIEW_HEAD_SHA'],
                   'mode': 'human-review' if human else 'verification',
                   'verificationFingerprint': os.environ['REVIEW_VERIFICATION_FINGERPRINT'],
                   'verificationProducerSha': os.environ['REVIEW_VERIFICATION_PRODUCER_SHA'],
                   'readyAt': now.isoformat(), 'expiresAt': (now + datetime.timedelta(seconds=seconds)).isoformat()}
          Path('runtime-review-meta/review-environment.json').write_text(json.dumps(owner), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'REVIEW_LEASE_SECONDS={seconds}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Review owner: {json.dumps(owner)}\n\n公开站：http://review.cc-lotus.info/\n\n中心党建：http://review.cc-lotus.info/party/\n\n管理端：http://review.cc-lotus.info/admin/\n")
          print(json.dumps(owner))
          PY
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors http://review.cc-lotus.info/review-environment.json -o review-external-owner.json
          cmp runtime-review-meta/review-environment.json review-external-owner.json

      - name: 上传外部访问与租约证据
        uses: actions/upload-artifact@v7
        with:
          name: review-external-runtime-evidence
          path: |
            review-local-runtime.json
            review-external-runtime.json
            review-external-owner.json
            review-verification.json
            review-baseline-restore/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: 输出评审地址
        run: |
          echo "公开站人工评审地址：http://review.cc-lotus.info/"
          echo "中心党建人工评审地址：http://review.cc-lotus.info/party/"
          echo "管理端人工评审地址：http://review.cc-lotus.info/admin/"
          echo "运行时已复用完整 CI 发布的 verified Frontend / Data Baseline / E2E marker。"

      - name: 保持环境运行
        run: |
          sleep "$REVIEW_LEASE_SECONDS"

      - name: 清理环境
        if: always()
        run: |
          docker rm -f cms-backend cms-frontend review-baseline-copy || true
          pkill -f '/frp/frpc' || true
