name: Party Migration De-specialization Verification

on:
  push:
    branches: [main]
    paths:
      - "backend/build.gradle.kts"
      - "backend/apps/content-migration/**"
      - "data-migrations/party/v1/manifest.json"
      - "data-migrations/party/v1/index.ndjson"
      - "data-migrations/party/v1/lists/**"
      - "data-migrations/party/v1/compatibility.json"
      - ".github/workflows/party-migration-despecialization-verification.yml"
  pull_request:
    paths:
      - "backend/build.gradle.kts"
      - "backend/apps/content-migration/**"
      - "data-migrations/party/v1/manifest.json"
      - "data-migrations/party/v1/index.ndjson"
      - "data-migrations/party/v1/lists/**"
      - "data-migrations/party/v1/compatibility.json"
      - ".github/workflows/party-migration-despecialization-verification.yml"

permissions:
  contents: read

jobs:
  party-migration-despecialization:
    name: Party adapter and compatibility authority verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: party_migration_verify
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Verify Party authority separation, compatibility guards and Generic delegation
        working-directory: backend
        env:
          PARTY_MIGRATION_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/party_migration_verify?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          PARTY_MIGRATION_VERIFY_DB_USERNAME: root
          PARTY_MIGRATION_VERIFY_DB_PASSWORD: root
        run: gradle verifyPartyMigrationDespecialization --no-daemon
