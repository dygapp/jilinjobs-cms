name: EU-50 Budget Page Asset Promotion

on:
  pull_request:
    paths:
      - '.github/workflows/eu50-budget-page-asset-acquisition.yml'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Promote confirmed budget Page PDFs into Site Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Download frozen Page source artifact
        uses: actions/download-artifact@v7
        with:
          name: eu50-main-retry-attempt-3-a96cee22449508f92f3c89789f99aad477286a66
          path: budget-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34303771704
      - name: Build package-owned budget Page assets
        shell: bash
        run: |
          set -euo pipefail
          target='sites/jilinjobs/assets/pages/budget'
          mkdir -p "$target"

          cp budget-source/generated-candidate/pages/items/main-page-root-budget/assets/04436e3650fcb196dbdd14c599ee2f011eda363574a983a2b9f0655aaaba6586.pdf "$target/management-policy.pdf"
          cp budget-source/generated-candidate/pages/items/main-page-root-budget/assets/9c0804ab18d298d97ad821ed59391a5dc7981aaeaacd5502babfbea148fc3578.pdf "$target/budget-2021.pdf"
          cp budget-source/generated-candidate/pages/items/main-page-root-budget/assets/e200fa74b861af37fb24b99e6f28bb8f72d42f25dab392dc06e35ed43c4e8006.pdf "$target/budget-2022.pdf"
          cp budget-source/generated-candidate/pages/items/main-page-root-budget/assets/c5c6ac1e2dcaf53dc72d63c0a7d585187baa98e610e97f1412dd528dda403495.pdf "$target/final-accounts-2020.pdf"
          cp budget-source/generated-candidate/pages/items/main-page-root-budget/assets/ff0f851fc9f76de6d22fc97d97b5c62886bb987d583f41f86ec8d18da9a3fa23.pdf "$target/final-accounts-2021.pdf"

          cat > /tmp/budget-sources.tsv <<'EOF'
          budget-2023.pdf	https://zhjy.jilinjobs.cn:8080/group1/cms/t_biz_attachment/content2/2023-02-27/8331fd04-91d2-4365-8576-44a7adb40d44.pdf
          budget-2024.pdf	https://zhjy.jilinjobs.cn:8080/group1/cms/t_biz_attachment/content2/2024-03-12/d87173cd-8a3f-4667-a042-ece836a0f0ea.pdf
          budget-2025.pdf	https://zhjy.jilinjobs.cn:8080/group1/cms/t_biz_attachment/content2/2025-03-07/ceb5b088-6158-4b73-b446-3cf650194866.pdf
          budget-2026.pdf	https://zhjy.jilinjobs.cn:8080/group1/cms/t_biz_attachment/content2/2026-03-17/84773049-6580-4c9d-87ce-ab29f9576157.pdf
          final-accounts-2022.pdf	https://zhjy.jilinjobs.cn:8080/group1/cms/t_biz_attachment/content2/2023-09-08/e74779f2-e551-43ad-a5f8-0a91020e8d00.pdf
          final-accounts-2023.pdf	https://zhjy.jilinjobs.cn:8080/group1/cms/t_biz_attachment/content2/2024-09-12/f7b003d5-9074-4d26-ac58-827131c02f22.pdf
          final-accounts-2024.pdf	https://zhjy.jilinjobs.cn:8080/group1/cms/t_biz_attachment/content2/2025-09-05/4851fa77-f787-4d7f-be10-34490a98df0f.pdf
          final-accounts-2025.pdf	https://zhjy.jilinjobs.cn:8080/group1/cms/t_biz_attachment/content2/2026-09-04/75b071b2-c354-4690-bb8e-2bdc25e600bb.pdf
          EOF
          while IFS=$'\t' read -r name url; do
            curl --fail --location --silent --show-error --connect-timeout 20 --max-time 120 --retry 1 --retry-delay 2 --output "$target/$name" "$url"
          done < /tmp/budget-sources.tsv

          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          asset_dir = root / 'sites/jilinjobs/assets/pages/budget'
          expected = [
              'management-policy.pdf',
              'budget-2021.pdf','budget-2022.pdf','budget-2023.pdf','budget-2024.pdf','budget-2025.pdf','budget-2026.pdf',
              'final-accounts-2020.pdf','final-accounts-2021.pdf','final-accounts-2022.pdf','final-accounts-2023.pdf','final-accounts-2024.pdf','final-accounts-2025.pdf',
          ]
          for name in expected:
              data = (asset_dir / name).read_bytes()
              if not data.startswith(b'%PDF-'):
                  raise SystemExit(f'{name} is not a PDF')

          manifest_path = root / 'sites/jilinjobs/assets/manifest.json'
          manifest = json.loads(manifest_path.read_text())
          assets = [item for item in manifest['assets'] if not str(item.get('target','')).startswith('/static/pages/budget/')]
          for name in expected:
              data = (asset_dir / name).read_bytes()
              assets.append({
                  'source': f'assets/pages/budget/{name}',
                  'target': f'/static/pages/budget/{name}',
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest['assets'] = assets
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          page_path = root / 'sites/jilinjobs/structure/pages.json'
          pages = json.loads(page_path.read_text())
          links = [
              ('management-policy.pdf','吉林省高等学校毕业生就业指导中心预决算公开管理制度'),
              ('budget-2021.pdf','吉林省高等学校毕业生就业指导中心2021年单位预算'),
              ('budget-2022.pdf','吉林省高等学校毕业生就业指导中心2022年单位预算'),
              ('budget-2023.pdf','吉林省高等学校毕业生就业指导中心2023年单位预算'),
              ('budget-2024.pdf','吉林省高等学校毕业生就业指导中心2024 年部门预算'),
              ('budget-2025.pdf','吉林省高等学校毕业生就业指导中心2025 年部门预算'),
              ('budget-2026.pdf','吉林省高等学校毕业生就业指导中心2026 年部门预算'),
              ('final-accounts-2020.pdf','吉林省高等学校毕业生就业指导中心2020年度决算公开'),
              ('final-accounts-2021.pdf','吉林省高等学校毕业生就业指导中心2021年度决算公开'),
              ('final-accounts-2022.pdf','吉林省高等学校毕业生就业指导中心2022年度决算公开'),
              ('final-accounts-2023.pdf','吉林省高等学校毕业生就业指导中心2023年度决算公开'),
              ('final-accounts-2024.pdf','吉林省高等学校毕业生就业指导中心2024年度决算公开'),
              ('final-accounts-2025.pdf','吉林省高等学校毕业生就业指导中心2025年度决算公开'),
          ]
          body = ''.join(f'<p><a href="/static/pages/budget/{name}" target="_blank">{title}</a></p>' for name, title in links)
          budget = next((p for p in pages if p.get('groupAlias') is None and p.get('alias') == 'budget'), None)
          if budget is None:
              raise SystemExit('budget Page not found')
          budget['bodyHtml'] = body
          page_path.write_text(json.dumps(pages, ensure_ascii=False, separators=(',', ':')) + '\n')

          readme_path = root / 'sites/jilinjobs/assets/README.md'
          readme = readme_path.read_text()
          note = '\n`pages/**` 保存 stable Page 正文直接引用的 Site Package 静态文件；例如 `pages/budget/**` 统一承载“预决算公开”附件，公开路径为 `/static/pages/budget/**`，不继承 Legacy CMS 的上传目录结构。\n'
          if '`pages/**`' not in readme:
              readme_path.write_text(readme.rstrip() + '\n' + note)
          PY

          rm -rf budget-source
          git rm .github/workflows/eu50-budget-page-asset-acquisition.yml
          git add sites/jilinjobs/assets sites/jilinjobs/structure/pages.json
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          allowed = all(
              f == '.github/workflows/eu50-budget-page-asset-acquisition.yml'
              or f == 'sites/jilinjobs/structure/pages.json'
              or f == 'sites/jilinjobs/assets/manifest.json'
              or f == 'sites/jilinjobs/assets/README.md'
              or f.startswith('sites/jilinjobs/assets/pages/budget/')
              for f in files
          )
          if not allowed:
              raise SystemExit(f'unexpected staged paths: {files}')
          print('\n'.join(files))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'EU-50: promote budget Page stable assets'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
