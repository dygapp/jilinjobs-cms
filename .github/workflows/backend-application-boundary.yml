name: Backend Application Boundary Verification

on:
  push:
    branches: [main]
    paths:
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/modules/cms-core/**"
      - "backend/apps/cms-server/**"
      - "backend/apps/content-migration/**"
      - ".github/workflows/backend-application-boundary.yml"
  pull_request:
    paths:
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/modules/cms-core/**"
      - "backend/apps/cms-server/**"
      - "backend/apps/content-migration/**"
      - ".github/workflows/backend-application-boundary.yml"

permissions:
  contents: read

jobs:
  boundary:
    name: Backend application boundary verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: eu46_boundary
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Verify packaged and runtime application boundaries
        working-directory: backend
        env:
          MIGRATION_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/eu46_boundary?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          MIGRATION_VERIFY_DB_USERNAME: root
          MIGRATION_VERIFY_DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/eu46-boundary/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/eu46-boundary/static
        run: gradle bootJar verifyContentMigrationBoundary --no-daemon
