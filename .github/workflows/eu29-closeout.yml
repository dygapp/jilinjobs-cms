name: EU-29 Final Closeout

on:
  push:
    branches:
      - feature/eu-29-party-history-migration
    paths:
      - .github/workflows/eu29-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch Review Environment to canonical Party dataset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('.github/workflows/review-environment.yml')
          text=path.read_text(encoding='utf-8')
          old_env="""env:\n  EU29_REAL_PARTY: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/eu-29-party-history-migration') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == 'feature/eu-29-party-history-migration') }}\n"""
          new_env="""env:\n  PARTY_CANONICAL_DATA: 'true'\n"""
          assert old_env in text
          text=text.replace(old_env,new_env,1)
          text=text.replace('EU29_REAL_PARTY','PARTY_CANONICAL_DATA')

          start=text.index('      - name: 下载并导入 EU-29 真实党建历史 Snapshot\n')
          end=text.index('      - name: 准备 Human Review 主站示例内容\n', start)
          replacement="""      - name: 导入 Party canonical 历史数据\n        if: env.PARTY_CANONICAL_DATA == 'true'\n        env:\n          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true\n          DB_USERNAME: root\n          DB_PASSWORD: root\n          CMS_STORAGE_ROOT: ${{ github.workspace }}/runtime-uploads\n          CMS_STATIC_ROOT: ${{ github.workspace }}/runtime-static\n        run: |\n          set -euo pipefail\n          canonical_root=\"$GITHUB_WORKSPACE/data-migrations/party/v1\"\n          test -f \"$canonical_root/manifest.json\"\n          test -f \"$canonical_root/index.ndjson\"\n          test -f \"$canonical_root/lists/PARTY_CAROUSEL/index.json\"\n          jq --exit-status '\n            .status == \"accepted-canonical\"\n            and .acceptedSnapshot.articles == 181\n            and .acceptedSnapshot.internalArticles == 120\n            and .acceptedSnapshot.externalArticles == 61\n            and .acceptedSnapshot.carouselItems == 4\n            and .acceptedSnapshot.unresolved == 0\n            and .acceptedSnapshot.artifactDigest == \"sha256:230ac0df997b3dc913ed38503a8289eae30d8bb0a455fd858e388ddc27066148\"' \"$canonical_root/manifest.json\" > /dev/null\n\n          (cd backend && gradle importPartyHistoricalContent --args=\"../data-migrations/party/v1\" --no-daemon) | tee eu29-review-article-import.log\n          (cd backend && gradle importPartyCarousel --args=\"../data-migrations/party/v1\" --no-daemon) | tee eu29-review-carousel-import.log\n\n          python3 - <<'PY2'\n          import json, re\n          from pathlib import Path\n          manifest=json.loads(Path('data-migrations/party/v1/manifest.json').read_text(encoding='utf-8'))\n          expected=manifest['acceptedSnapshot']\n          article_text=Path('eu29-review-article-import.log').read_text(encoding='utf-8')\n          article=json.loads(re.findall(r'EU29_IMPORT_REPORT (\\{.*\\})', article_text)[-1])\n          assert article['total']==expected['articles'] and article['created']==expected['articles'], article\n          assert article['skipped']==0 and article['conflicts']==0 and article['invalid']==0, article\n          carousel_text=Path('eu29-review-carousel-import.log').read_text(encoding='utf-8')\n          carousel=json.loads(re.findall(r'EU29_CAROUSEL_IMPORT_REPORT (\\{.*\\})', carousel_text)[-1])\n          assert carousel['total']==expected['carouselItems'] and carousel['created']==expected['carouselItems'], carousel\n          assert carousel['skipped']==0 and carousel['conflicts']==0 and carousel['invalid']==0, carousel\n          PY2\n\n          docker run --rm --network host mysql:8.4 \\\n            mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot jilinjobs_cms -N -B -e \\\n            \"SELECT c.alias,COUNT(a.id) FROM cms_column c LEFT JOIN cms_article a ON a.column_id=c.id AND a.status='PUBLISHED' WHERE c.alias IN ('party-voice','party-work','party-rules','party-study') GROUP BY c.alias ORDER BY c.alias\" \\\n            | tee eu29-review-column-counts.tsv\n          node - <<'NODE'\n          const fs=require('fs')\n          const manifest=require('./data-migrations/party/v1/manifest.json')\n          const expected=Object.fromEntries(manifest.contentScope.map(scope=>[scope.columnAlias,scope.observedListCount]))\n          const rows=fs.readFileSync('eu29-review-column-counts.tsv','utf8').trim().split(/\\n/).map(line=>line.split('\\t'))\n          if (rows.length !== 4) throw new Error(`Party column rows=${rows.length}`)\n          for (const [alias,count] of rows) if (Number(count)!==expected[alias]) throw new Error(`${alias}: ${count} != ${expected[alias]}`)\n          NODE\n\n"""
          text=text[:start]+replacement+text[end:]

          old_runtime="""          if [ \"$PARTY_CANONICAL_DATA\" = \"true\" ]; then\n            pointer=.github/review/eu29-party-snapshot.json\n            expected=$(jq -r '.articles' \"$pointer\")\n            total=$(curl --fail --silent 'http://127.0.0.1:5173/api/public/articles?page=0&size=1' | jq -r '.total')\n            test \"$total\" -ge \"$expected\"\n            curl --fail --silent http://127.0.0.1:5173/api/public/lists/by-code/PARTY_CAROUSEL \\\n              | jq --argjson expected \"$(cat \"$pointer\")\" --exit-status '\n                  (.items | length == $expected.carouselItems)\n                  and ([.items[].title] == $expected.carouselTitles)\n                  and all(.items[]; (.imagePath // \"\") | startswith(\"/static/migrated/party/carousel/\"))\n                  and all(.items[]; .openMode == \"NEW_WINDOW\")' > /dev/null\n"""
          new_runtime="""          if [ \"$PARTY_CANONICAL_DATA\" = \"true\" ]; then\n            expected=$(jq -r '.acceptedSnapshot.articles' data-migrations/party/v1/manifest.json)\n            total=$(curl --fail --silent 'http://127.0.0.1:5173/api/public/articles?page=0&size=1' | jq -r '.total')\n            test \"$total\" -ge \"$expected\"\n            expected_titles=$(node - <<'NODE'\n          const fs=require('fs')\n          const root='data-migrations/party/v1/lists/PARTY_CAROUSEL'\n          const index=JSON.parse(fs.readFileSync(`${root}/index.json`,'utf8'))\n          const items=index.items.sort((a,b)=>a.sourceOrder-b.sourceOrder).map(ref=>JSON.parse(fs.readFileSync(`${root}/${ref.path}`,'utf8')).title)\n          process.stdout.write(JSON.stringify(items))\n          NODE\n            )\n            curl --fail --silent http://127.0.0.1:5173/api/public/lists/by-code/PARTY_CAROUSEL \\\n              | jq --argjson expectedTitles \"$expected_titles\" --exit-status '\n                  (.items | length == 4)\n                  and ([.items[].title] == $expectedTitles)\n                  and all(.items[]; (.imagePath // \"\") | startswith(\"/static/migrated/party/carousel/\"))\n                  and all(.items[]; .openMode == \"NEW_WINDOW\")' > /dev/null\n"""
          assert old_runtime in text
          text=text.replace(old_runtime,new_runtime,1)
          text=text.replace('执行 EU-29 真实迁移 Runtime Browser 验证','执行 Party canonical Runtime Browser 验证')
          text=text.replace('上传 EU-29 Human Review 证据','上传 Party canonical Human Review 证据')
          text=text.replace('name: eu29-party-human-review-evidence','name: party-canonical-human-review-evidence')
          text=text.replace('            .github/review/eu29-party-snapshot.json\n','            data-migrations/party/v1/manifest.json\n            data-migrations/party/v1/index.ndjson\n            data-migrations/party/v1/reports/canonical-promotion.json\n')
          path.write_text(text,encoding='utf-8')
          PY

      - name: Finalize canonical manifest provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('data-migrations/party/v1/manifest.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          accepted=data['acceptedSnapshot']
          accepted.update({
              'sourceWorkflowRunId': 33831279817,
              'sourceWorkflowRunNumber': 7,
              'sourceArtifactId': 9921976616,
              'sourceHeadSha': 'ad1cfda1921e69e41d1cebc808263adbb70c8d48',
          })
          data['acceptance']={
              'humanReview': 'PASS',
              'acceptedAt': '2026-09-04',
              'closeout': 'EU-29 final closeout authorized by project owner',
              'canonicalVerificationRunId': 33844142237,
          }
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pointer=Path('.github/review/eu29-party-snapshot.json')
          if pointer.exists(): pointer.unlink()
          PY

      - name: Close EU-29 roadmap and execution unit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap=Path('docs/project/project-roadmap.md')
          text=roadmap.read_text(encoding='utf-8')
          replacements={
            '| 中心党建正式页面与内容收敛 | **当前** | EU-26～EU-28 已完成；当前进入 EU-29 历史内容迁移与最终 Review，保持真实四栏目、通用 CMS、Party canonical URL 与最终回归责任 |': '| 中心党建正式页面与内容收敛 | 已完成 | EU-26～EU-29 全部关闭；真实四栏目、历史文章/资源/轮播已固化为仓库 canonical migration dataset，并完成最终 Human Review 与 Fresh DB 验证 |',
            '| EU-30 轮播图方案与实现收敛 | 后续已规划 |': '| EU-30 轮播图方案与实现收敛 | **当前** |',
            '## 当前阶段：中心党建正式页面与内容收敛': '## 已完成阶段：中心党建正式页面与内容收敛',
            '→ EU-29 Party Historical Content Migration & Final Review：当前': '→ EU-29 Party Historical Content Migration & Final Review：已完成',
            '6. EU-26～EU-28 已完成；当前只按 EU-29 的历史内容迁移、最终回归与 Review 责任继续收敛；': '6. EU-26～EU-29 已完成；党建正式页面与历史内容收敛阶段关闭；',
            '7. EU-29 建立幂等内容迁移和 legacy URL 映射证据，最终 Human Review 通过后关闭党建阶段；': '7. EU-29 已建立幂等内容迁移、legacy identity/fingerprint、canonical dataset 与最终 Human Review 证据；后续历史内容增量直接维护 canonical dataset；',
            '## 已规划后续阶段：EU-30～EU-31': '## 当前及后续阶段：EU-30～EU-31',
            '- **EU-30** 当前只做占位规划：': '- **EU-30** 当前开始：',
            '- 当前主动路线为 EU-29 中心党建历史内容迁移与最终 Review；': '- 当前主动路线为 EU-30 轮播图方案与实现收敛；',
            '- 党建完整内容和最终视觉不得因基础框架已经完成而提前声明完成；\n': '',
            '- EU-29 Human Review 关闭后切换到 EU-30 轮播图方案与实现收敛；': '- EU-29 已关闭，当前已切换到 EU-30 轮播图方案与实现收敛；',
          }
          for old,new in replacements.items():
              assert old in text, old
              text=text.replace(old,new,1)
          milestone='| 2026-09-04 | EU-29 历史内容迁移与最终 Human Review 关闭：181 篇历史文章（120 INTERNAL / 61 EXTERNAL_LINK）、184 个历史资源和 4 条中心党建轮播从已验收 Snapshot 无损晋升为 `data-migrations/party/v1` canonical dataset；Fresh DB 首次导入、二次幂等、资源 SHA 与 Runtime reconciliation 通过，Review Environment 改为长期直接消费仓库 canonical 数据 |\n'
          marker='| 2026-09-04 | 固化 EU-29 之后的前端后续路线：先执行 EU-30 轮播图方案与实现收敛，再执行 EU-31 浏览器兼容性与 Runtime Guard 收敛；EU-30 当前只保留占位级规划，EU-31 已记录 Public / Admin 双标准、Public IE11 备用路径与独立兼容 Workflow 边界 |\n'
          assert marker in text
          text=text.replace(marker,marker+milestone,1)
          roadmap.write_text(text,encoding='utf-8')

          units=Path('docs/work/party-convergence-execution-units.md')
          text=units.read_text(encoding='utf-8')
          old='**状态：进行中（2026-09-04），EU-26～EU-28 已完成，当前 EU-29 Party Historical Content Migration & Final Review。**'
          new='**状态：已完成（2026-09-04），EU-26～EU-29 全部关闭；后续路线切换到 EU-30 Carousel Architecture & Behavior Convergence。**'
          assert old in text
          text=text.replace(old,new,1)
          anchor='- Human Review 通过后 Roadmap 才可切换到后续阶段。'
          assert anchor in text
          closure='''- Human Review 通过后 Roadmap 才可切换到后续阶段。\n\n### Final Closure — 2026-09-04\n\n- Human Review：PASS；本轮人工发现的栏目共享视觉、后台长标题、加载状态与 Party 红色交互主题问题均已关闭；\n- 冻结来源：EU-29 Party Migration Evidence Run #7，181 篇文章（120 INTERNAL / 61 EXTERNAL_LINK）、184 个资源、4 条 `PARTY_CAROUSEL`，unresolved=0；\n- 长期权威数据：`data-migrations/party/v1` Canonical Migration Dataset，不再依赖即将过期的 Actions Artifact；\n- 文章采用 `index.ndjson + articles/<stable-id>/article.json + assets/**` 自包含单元，轮播采用 `lists/PARTY_CAROUSEL/index.json + items/**`；\n- Source Artifact 的 Run / Artifact / head / digest 保存在 canonical `manifest.json` provenance 中；\n- Canonical Migration Verification 已完成 Fresh DB、首次 181+4 创建、第二次 181+4 全部 SKIPPED、栏目计数、Runtime 轮播资源 SHA 对账；\n- Review Environment 已改为直接导入仓库 canonical dataset，后续 EU-30 / EU-31 评审继续使用同一真实党建历史数据；\n- EU-29 关闭，不再把历史 Snapshot ZIP 作为稳定 CI / Review 依赖。'''
          text=text.replace(anchor,closure,1)
          units.write_text(text,encoding='utf-8')
          PY

      - name: Commit final closeout
        run: |
          set -euo pipefail
          rm .github/workflows/eu29-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/review-environment.yml .github/review data-migrations/party/v1/manifest.json docs/project/project-roadmap.md docs/work/party-convergence-execution-units.md .github/workflows/eu29-closeout.yml
          git status --short
          git commit -m 'docs(project): 关闭 EU-29 并切换 EU-30'
          git push origin HEAD:${GITHUB_REF_NAME}
