name: EU-42 Apply Safe

on:
  push:
    branches:
      - feature/eu-42-site-asset-runtime-projection
    paths:
      - ".github/workflows/eu42-apply-safe.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/eu-42-site-asset-runtime-projection
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Reuse validated implementation script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/eu42-apply.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line == '      - name: Apply EU-42 implementation')
          end = next(i for i, line in enumerate(lines[start + 1:], start + 1) if line == '      - name: Compile and run backend unit tests')
          run_line = next(i for i in range(start, end) if lines[i] == '        run: |')
          script = []
          for line in lines[run_line + 1:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/eu42-apply.sh').write_text('\n'.join(script) + '\n', encoding='utf-8')
          PY
          bash /tmp/eu42-apply.sh
      - name: Compile and run backend unit tests
        working-directory: backend
        run: gradle clean test testClasses --no-daemon
      - name: Commit implementation without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git restore -- .github/workflows
          git config user.name "dygapp"
          git config user.email "dygapp@qq.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat: project Site Package assets at runtime"
          git push origin HEAD:feature/eu-42-site-asset-runtime-projection
