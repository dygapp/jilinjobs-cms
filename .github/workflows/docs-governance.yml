name: 文档治理检查

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
      - 'skills/**'
      - 'scripts/verify-docs-governance.mjs'
      - '.github/workflows/docs-governance.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
      - 'skills/**'
      - 'scripts/verify-docs-governance.mjs'
      - '.github/workflows/docs-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-docs-governance:
    name: 中文主语言与文档引用完整性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出精确验证对象
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: 核对精确验证对象
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: 运行文档治理检查
        run: node scripts/verify-docs-governance.mjs
      - name: 校验公开站视觉设计规范
        run: npx --yes @google/design.md@0.4.0 lint docs/design/public-site/DESIGN.md
