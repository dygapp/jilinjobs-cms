name: Site Package Verification

on:
  push:
    branches: [main]
    paths:
      - "backend/build.gradle.kts"
      - "backend/src/main/kotlin/com/jilinjobs/cms/provisioning/**"
      - "backend/src/test/kotlin/com/jilinjobs/cms/provisioning/**"
      - "backend/src/main/resources/db/migration/**"
      - "sites/**"
      - ".github/workflows/site-package-verification.yml"
  pull_request:
    paths:
      - "backend/build.gradle.kts"
      - "backend/src/main/kotlin/com/jilinjobs/cms/provisioning/**"
      - "backend/src/test/kotlin/com/jilinjobs/cms/provisioning/**"
      - "backend/src/main/resources/db/migration/**"
      - "sites/**"
      - ".github/workflows/site-package-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Site Package verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: site_package_verify
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Verify Site Package contracts
        working-directory: backend
        env:
          SITE_PACKAGE_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/site_package_verify?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          SITE_PACKAGE_VERIFY_DB_USERNAME: root
          SITE_PACKAGE_VERIFY_DB_PASSWORD: root
        run: gradle verifySitePackageFoundation verifyStableSiteStructure verifyRuntimeSitePackageComposition --no-daemon
