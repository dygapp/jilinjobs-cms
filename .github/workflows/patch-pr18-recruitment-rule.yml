name: PR18 Recruitment Rule Patch

on:
  push:
    branches:
      - feature/page-detail-visual-convergence-20260828
    paths:
      - .github/workflows/patch-pr18-recruitment-rule.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/page-detail-visual-convergence-20260828
          fetch-depth: 0

      - name: Patch requirement
        run: python3 .github/scripts/patch-recruitment-article-rule.py

      - name: Commit requirement correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/requirements/information-publishing.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(content): 修正招聘公告文章类型规则"
          git push origin HEAD:feature/page-detail-visual-convergence-20260828
