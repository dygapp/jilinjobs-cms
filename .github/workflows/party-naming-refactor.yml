name: 一次性 Party 命名重构

on:
  push:
    branches:
      - feat/party-building-visual-fidelity
    paths:
      - .github/workflows/party-naming-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/party-building-visual-fidelity
          fetch-depth: 0
      - name: 执行 Party 命名重构
        run: bash .github/scripts/party-naming-refactor.sh
