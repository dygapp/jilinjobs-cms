name: Canonical Migration Verification

on:
  pull_request:
    paths:
      - 'data-migrations/party/v1/**'
      - '!data-migrations/party/v1/**/*.md'
      - 'backend/build.gradle.kts'
      - 'backend/settings.gradle.kts'
      - 'backend/modules/cms-core/**'
      - 'backend/apps/cms-server/**'
      - 'backend/apps/content-migration/**'
      - '.github/workflows/canonical-migration-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-dataset:
    name: Party canonical dataset on Generic Migration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v7

      - name: Validate canonical dataset structure and bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          root = Path('data-migrations/party/v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'accepted-canonical', manifest
          accepted = manifest['acceptedSnapshot']
          extension = manifest.get('candidateExtension') or {}
          runtime_articles = int(extension.get('runtimeDatasetArticles', accepted['articles']))
          runtime_internal = int(accepted['internalArticles']) + int(extension.get('internalArticles', 0))
          runtime_external = int(accepted['externalArticles']) + int(extension.get('externalArticles', 0))
          assert accepted['articles'] == 181
          assert accepted['carouselItems'] == 4
          assert accepted['unresolved'] == 0
          assert runtime_articles == 183

          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(chunk)
              return value.hexdigest()

          rows = [json.loads(line) for line in (root / 'index.ndjson').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows) == runtime_articles, (len(rows), runtime_articles)
          assert len({row['legacyKey'] for row in rows}) == runtime_articles
          assert len({row['path'] for row in rows}) == runtime_articles
          assert all(set(row) == {'legacyKey', 'path'} for row in rows), rows[0]

          article_types = {'INTERNAL': 0, 'EXTERNAL_LINK': 0}
          by_alias = {}
          for row in rows:
              article_path = (root / row['path']).resolve()
              assert root.resolve() in article_path.parents and article_path.is_file(), row
              article = json.loads(article_path.read_text(encoding='utf-8'))
              assert article['source']['legacyKey'] == row['legacyKey']
              assert re.fullmatch(r'[0-9a-f]{64}', article['sourceFingerprint'])
              article_type = article['target']['articleType']
              article_types[article_type] += 1
              alias = article['target']['columnAlias']
              by_alias[alias] = by_alias.get(alias, 0) + 1
              declared = {resource['snapshotPath'] for resource in article['resources']}
              for resource in article['resources']:
                  path = article_path.parent / resource['snapshotPath']
                  assert path.is_file(), path
                  assert path.stat().st_size == resource['sizeBytes']
                  assert digest(path) == resource['sha256']
              for relative in re.findall(r'(?:src|href)=["\'](assets/[^"\']+)["\']', article['content']['bodyHtml']):
                  assert relative in declared, (row['legacyKey'], relative)

          expected_scope = {scope['columnAlias']: int(scope['observedListCount']) for scope in manifest['contentScope']}
          assert by_alias == expected_scope, (by_alias, expected_scope)
          assert article_types == {'INTERNAL': runtime_internal, 'EXTERNAL_LINK': runtime_external}, article_types

          carousel_root = root / 'lists/PARTY_CAROUSEL'
          carousel = json.loads((carousel_root / 'index.json').read_text(encoding='utf-8'))
          assert carousel['listCode'] == 'PARTY_CAROUSEL'
          assert len(carousel['items']) == 4
          assert {item['sourceOrder'] for item in carousel['items']} == {1, 2, 3, 4}
          by_order = {}
          for reference in carousel['items']:
              item_path = (carousel_root / reference['path']).resolve()
              assert carousel_root.resolve() in item_path.parents and item_path.is_file(), reference
              item = json.loads(item_path.read_text(encoding='utf-8'))
              assert item['legacyKey'] == reference['legacyKey']
              assert item['sourceFingerprint'] == reference['sourceFingerprint']
              assert item['sourceOrder'] == reference['sourceOrder']
              assert item['sourceType'] in {'LINK', 'ARTICLE'}
              assert item['openMode'] in {'DEFAULT', 'SAME_WINDOW', 'NEW_WINDOW'}
              image = item['image']
              image_path = item_path.parent / image['snapshotPath']
              assert image_path.is_file(), image_path
              assert image_path.stat().st_size == image['sizeBytes']
              assert digest(image_path) == image['sha256']
              if item['sourceType'] == 'ARTICLE':
                  assert 'articleReference' in item and 'url' not in item, item
              else:
                  assert item['url'].startswith(('http://', 'https://')), item
                  assert item['staticTarget'].startswith('migrated/'), item
              by_order[item['sourceOrder']] = item

          assert by_order[2]['sourceType'] == 'ARTICLE', by_order[2]
          assert by_order[2]['articleReference']['sourceSystem'] == manifest['sourceSystem'], by_order[2]
          assert by_order[2]['articleReference']['legacyKey'] == extension['articleRefForCarouselPosition2'], by_order[2]
          assert all(by_order[order]['sourceType'] == 'LINK' for order in (1, 3, 4))

          compatibility = json.loads((root / 'compatibility.json').read_text(encoding='utf-8'))
          assert compatibility['version'] == 1
          transitions = compatibility['listItemTransitions']
          assert len(transitions) == 1
          transition = transitions[0]
          assert transition['legacyKey'] == by_order[2]['legacyKey']
          assert transition['fromSourceType'] == 'LINK'
          assert transition['preserveRuntimeId'] is True
          print(json.dumps({
              'runtimeArticles': runtime_articles,
              'carouselItems': 4,
              'canonicalTotal': runtime_articles + 4,
          }, ensure_ascii=False))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Compile migration and provisioning applications
        working-directory: backend
        run: gradle :apps:cms-server:classes :apps:content-migration:classes --no-daemon

      - name: Provision stable Site Package targets
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
        run: gradle provisionSitePackage --args="../sites/jilinjobs" --no-daemon

      - name: Import canonical dataset through Generic Migration
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/canonical-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/canonical-runtime/static
        run: |
          mkdir -p "$GITHUB_WORKSPACE/canonical-runtime/uploads" "$GITHUB_WORKSPACE/canonical-runtime/static"
          gradle runContentMigration --args="../data-migrations/party/v1" --no-daemon | tee ../canonical-first-import.log

      - name: Verify first import and Runtime projection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          manifest=json.load(open('data-migrations/party/v1/manifest.json', encoding='utf-8'))
          expected_articles=manifest.get('candidateExtension',{}).get('runtimeDatasetArticles',manifest['acceptedSnapshot']['articles'])
          expected_total=expected_articles + manifest['acceptedSnapshot']['carouselItems']
          text=open('canonical-first-import.log', encoding='utf-8').read()
          matches=re.findall(r'CONTENT_MIGRATION_REPORT (\{.*\})', text)
          assert matches, 'missing CONTENT_MIGRATION_REPORT'
          report=json.loads(matches[-1])
          assert report['total']==expected_total and report['created']==expected_total, report
          assert report['updated']==0 and report['skipped']==0 and report['conflicts']==0 and report['invalid']==0, report
          PY

          docker run --rm --network host mysql:8.4 mysql --default-character-set=utf8mb4             -h127.0.0.1 -uroot -proot jilinjobs_cms -N -B -e             "SELECT i.sort_order,i.title,i.source_type,COALESCE(i.article_id,''),COALESCE(am.legacy_key,''),COALESCE(i.image_path,''),COALESCE(i.image_resource_id,''),COALESCE(r.storage_key,''),COALESCE(m.image_sha256,'') FROM cms_list_item i JOIN cms_list l ON l.id=i.list_id JOIN cms_list_item_legacy_mapping m ON m.list_item_id=i.id LEFT JOIN cms_article_legacy_mapping am ON am.article_id=i.article_id LEFT JOIN cms_resource r ON r.id=i.image_resource_id WHERE l.code='PARTY_CAROUSEL' ORDER BY i.sort_order"             | tee canonical-carousel-db.tsv

          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          root=Path('data-migrations/party/v1/lists/PARTY_CAROUSEL')
          index=json.load(open(root/'index.json', encoding='utf-8'))
          expected=[json.load(open(root/ref['path'], encoding='utf-8'))
                    for ref in sorted(index['items'], key=lambda item:item['sourceOrder'])]
          rows=list(csv.reader(open('canonical-carousel-db.tsv', encoding='utf-8'), delimiter='\t'))
          assert len(rows)==4, rows
          for item,row in zip(expected,rows):
              order,title,source_type,article_id,article_legacy_key,image_path,image_resource_id,storage_key,image_sha=row
              assert int(order)==item['sourceOrder']
              assert title==item['title']
              assert source_type==item['sourceType']
              assert image_sha==item['image']['sha256']
              if source_type=='ARTICLE':
                  assert article_id and image_resource_id and storage_key and not image_path, row
                  assert article_legacy_key==item['articleReference']['legacyKey'], row
                  file=Path('canonical-runtime/uploads') / storage_key
              else:
                  assert not article_id and not article_legacy_key and not image_resource_id and not storage_key, row
                  assert image_path=='/static/' + item['staticTarget'], (image_path,item)
                  file=Path('canonical-runtime/static') / item['staticTarget']
              assert file.is_file(), file
              assert hashlib.sha256(file.read_bytes()).hexdigest()==image_sha
          PY

      - name: Re-import canonical dataset to prove idempotency
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          CMS_STORAGE_ROOT: ${{ github.workspace }}/canonical-runtime/uploads
          CMS_STATIC_ROOT: ${{ github.workspace }}/canonical-runtime/static
        run: gradle runContentMigration --args="../data-migrations/party/v1" --no-daemon | tee ../canonical-second-import.log

      - name: Verify idempotency and Runtime counts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          manifest=json.load(open('data-migrations/party/v1/manifest.json', encoding='utf-8'))
          expected_articles=manifest.get('candidateExtension',{}).get('runtimeDatasetArticles',manifest['acceptedSnapshot']['articles'])
          expected_total=expected_articles + manifest['acceptedSnapshot']['carouselItems']
          report=json.loads(re.findall(r'CONTENT_MIGRATION_REPORT (\{.*\})', open('canonical-second-import.log', encoding='utf-8').read())[-1])
          assert report['total']==expected_total and report['created']==0 and report['updated']==0 and report['skipped']==expected_total, report
          assert report['conflicts']==0 and report['invalid']==0, report
          PY

          article_count=$(docker run --rm --network host mysql:8.4 mysql -h127.0.0.1 -uroot -proot jilinjobs_cms -N -e "SELECT COUNT(*) FROM cms_article_legacy_mapping WHERE source_system='legacy-jilinjobs'")
          list_count=$(docker run --rm --network host mysql:8.4 mysql -h127.0.0.1 -uroot -proot jilinjobs_cms -N -e "SELECT COUNT(*) FROM cms_list_item_legacy_mapping WHERE source_system='legacy-jilinjobs'")
          test "$article_count" -eq 183
          test "$list_count" -eq 4

      - name: Upload canonical verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-migration-verification
          path: |
            canonical-first-import.log
            canonical-second-import.log
            canonical-carousel-db.tsv
          if-no-files-found: warn
          retention-days: 7
