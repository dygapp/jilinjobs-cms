name: 完整 CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: 要验证的提交、分支或标签
        required: false
        default: main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend verify
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: eu37_site_package
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Test and package backend
        working-directory: backend
        run: gradle clean test bootJar --no-daemon
      - name: Verify Site Package foundation
        working-directory: backend
        env:
          SITE_PACKAGE_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/eu37_site_package?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          SITE_PACKAGE_VERIFY_DB_USERNAME: root
          SITE_PACKAGE_VERIFY_DB_PASSWORD: root
        run: gradle verifySitePackageFoundation --no-daemon
      - name: Verify Runtime Site Package composition
        working-directory: backend
        env:
          SITE_PACKAGE_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/eu37_site_package?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          SITE_PACKAGE_VERIFY_DB_USERNAME: root
          SITE_PACKAGE_VERIFY_DB_PASSWORD: root
        run: gradle verifyRuntimeSitePackageComposition --no-daemon
      - name: Verify EU-41 Site bootstrap baseline separation
        working-directory: backend
        env:
          SITE_PACKAGE_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/eu37_site_package?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          SITE_PACKAGE_VERIFY_DB_USERNAME: root
          SITE_PACKAGE_VERIFY_DB_PASSWORD: root
        run: gradle verifySiteBootstrapBaselineSeparation --no-daemon
      - name: Verify EU-42 Site Package asset projection
        working-directory: backend
        env:
          SITE_PACKAGE_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/eu37_site_package?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          SITE_PACKAGE_VERIFY_DB_USERNAME: root
          SITE_PACKAGE_VERIFY_DB_PASSWORD: root
        run: gradle verifySitePackageAssets --no-daemon
      - name: Verify EU-60 link open-mode migration
        working-directory: backend
        env:
          SITE_PACKAGE_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/eu37_site_package?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          SITE_PACKAGE_VERIFY_DB_USERNAME: root
          SITE_PACKAGE_VERIFY_DB_PASSWORD: root
        run: gradle verifyLinkOpenModeMigration --no-daemon
      - name: Prepare isolated Content Migration verification databases
        run: |
          docker run --rm --network host mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot -e \
            "CREATE DATABASE IF NOT EXISTS migration_boundary; CREATE DATABASE IF NOT EXISTS generic_content_migration; CREATE DATABASE IF NOT EXISTS generic_list_item_compatibility;"
      - name: Verify Content Migration application boundary
        working-directory: backend
        env:
          MIGRATION_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/migration_boundary?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          MIGRATION_VERIFY_DB_USERNAME: root
          MIGRATION_VERIFY_DB_PASSWORD: root
        run: gradle verifyContentMigrationBoundary --no-daemon
      - name: Verify Generic Content Migration
        working-directory: backend
        env:
          GENERIC_MIGRATION_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/generic_content_migration?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          GENERIC_MIGRATION_VERIFY_DB_USERNAME: root
          GENERIC_MIGRATION_VERIFY_DB_PASSWORD: root
        run: |
          gradle verifyGenericContentMigration --no-daemon
          gradle verifyGenericPageContentMigration --no-daemon
      - name: Verify Generic ListItem compatibility
        working-directory: backend
        env:
          GENERIC_COMPATIBILITY_VERIFY_DB_URL: jdbc:mysql://127.0.0.1:3306/generic_list_item_compatibility?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
          GENERIC_COMPATIBILITY_VERIFY_DB_USERNAME: root
          GENERIC_COMPATIBILITY_VERIFY_DB_PASSWORD: root
        run: gradle verifyGenericListItemCompatibility --no-daemon
      - name: 计算 Backend Runtime fingerprint
        id: backend-fingerprint
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(bash scripts/backend-runtime-fingerprint.sh)"
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布已验证 Backend / Content Migration Runtime image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:${{ steps.backend-fingerprint.outputs.value }}
          MIGRATION_IMAGE: ghcr.io/${{ github.repository }}-content-migration:${{ steps.backend-fingerprint.outputs.value }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ steps.backend-fingerprint.outputs.source_sha }}" \
            --label "io.jilinjobs.backend-fingerprint=${{ steps.backend-fingerprint.outputs.value }}" \
            -t "$BACKEND_IMAGE" \
            -f backend/Dockerfile.runtime \
            backend
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ steps.backend-fingerprint.outputs.source_sha }}" \
            --label "io.jilinjobs.backend-fingerprint=${{ steps.backend-fingerprint.outputs.value }}" \
            -t "$MIGRATION_IMAGE" \
            -f backend/Dockerfile.migration-runtime \
            backend
          docker push "$BACKEND_IMAGE"
          docker push "$MIGRATION_IMAGE"
          {
            echo "Backend Runtime image：$BACKEND_IMAGE"
            echo "Content Migration Runtime image：$MIGRATION_IMAGE"
            echo "Backend source SHA：${{ steps.backend-fingerprint.outputs.source_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/build/libs/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3

  public-frontend:
    name: Public site frontend verify
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install public site dependencies
        working-directory: frontend/public-site
        run: npm install --no-audit --no-fund
      - name: Build public site
        working-directory: frontend/public-site
        run: npm run build
      - name: Upload public site artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-site-dist
          path: frontend/public-site/dist
          if-no-files-found: error
          retention-days: 3

  admin-frontend:
    name: Admin frontend verify
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - name: Install admin dependencies
        working-directory: frontend/admin
        run: npm ci --no-audit --no-fund
      - name: Build admin
        working-directory: frontend/admin
        run: npm run build
      - name: Upload admin artifact
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: frontend/admin/dist
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: Integrated browser verification
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    needs: [backend, public-frontend, admin-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-artifact
      - name: Download public site artifact
        uses: actions/download-artifact@v8
        with:
          name: public-site-dist
          path: public-site-dist
      - name: Download admin artifact
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: admin-dist
      - name: Prepare empty runtime static root
        run: |
          rm -rf runtime-static
          mkdir -p runtime-static
          test ! -e runtime-static/health/baseline.png
      - name: Pull predefined runtime images
        timeout-minutes: 12
        run: |
          docker pull eclipse-temurin:21-jre-alpine-3.23 & java_image_pid=$!
          docker pull nginx:1.29.8-alpine & nginx_image_pid=$!
          docker pull mcr.microsoft.com/playwright:v1.61.0-noble & playwright_image_pid=$!
          wait "$java_image_pid"
          wait "$nginx_image_pid"
          wait "$playwright_image_pid"
      - name: Start backend runtime container
        timeout-minutes: 5
        run: |
          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/runtime-static \
            -e CMS_SITE_PACKAGE_ROOT=/site-package \
            -e CMS_SITE_PACKAGE_BOOTSTRAP_ON_START=true \
            -v "$GITHUB_WORKSPACE/backend-artifact:/app:ro" \
            -v "$GITHUB_WORKSPACE/runtime-static:/runtime-static" \
            -v "$GITHUB_WORKSPACE/sites/jilinjobs:/site-package:ro" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/static/health/baseline.png > /dev/null
      - name: Start combined frontend runtime container
        timeout-minutes: 5
        run: |
          docker run -d --name cms-frontend --network host \
            -v "$GITHUB_WORKSPACE/public-site-dist:/usr/share/nginx/html/public:ro" \
            -v "$GITHUB_WORKSPACE/admin-dist:/usr/share/nginx/html/admin:ro" \
            -v "$GITHUB_WORKSPACE/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29.8-alpine
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/admin/ > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs cms-frontend
          exit 1
      - name: Run existing feature browser verification
        timeout-minutes: 12
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -e CI_EXTERNAL_WEB_SERVER=true \
            -e PARTY_REFERENCE_EVIDENCE="${{ contains(github.event.pull_request.head.ref || github.ref_name, 'party-building') }}" \
            -v "$GITHUB_WORKSPACE/frontend/public-site:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm install --no-audit --no-fund && npm run test:e2e'
      - name: Run admin browser verification
        if: ${{ hashFiles('frontend/admin/tests/e2e/*.spec.ts') != '' }}
        timeout-minutes: 8
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -v "$GITHUB_WORKSPACE/frontend/admin:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm ci --no-audit --no-fund && npm run test:e2e'
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            frontend/public-site/playwright-report
            frontend/public-site/test-results
            frontend/admin/playwright-report
            frontend/admin/test-results
          if-no-files-found: warn
          retention-days: 5
      - name: Capture runtime diagnostics
        if: failure()
        run: |
          mkdir -p runtime-diagnostics
          docker ps -a > runtime-diagnostics/docker-ps.txt 2>&1 || true
          docker inspect cms-backend > runtime-diagnostics/backend-inspect.json 2>&1 || true
          docker logs cms-backend > runtime-diagnostics/backend.log 2>&1 || true
          docker inspect cms-frontend > runtime-diagnostics/frontend-inspect.json 2>&1 || true
          docker logs cms-frontend > runtime-diagnostics/frontend.log 2>&1 || true
      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-diagnostics
          path: runtime-diagnostics
          if-no-files-found: error
          retention-days: 5
      - name: Stop runtime containers
        if: always()
        run: docker rm -f cms-backend cms-frontend || true

  review-runtime-cache:
    name: Publish verified review runtime
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    needs: [backend, public-frontend, admin-frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download public site artifact
        uses: actions/download-artifact@v8
        with:
          name: public-site-dist
          path: public-site-dist

      - name: Download admin artifact
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: admin-dist

      - name: 计算 Review Runtime identities
        id: review-identities
        shell: bash
        run: |
          set -euo pipefail
          backend="$(bash scripts/backend-runtime-fingerprint.sh)"
          frontend="$(bash scripts/frontend-runtime-fingerprint.sh)"
          baseline="$(bash scripts/review-baseline-fingerprint.sh)"
          verification="$(bash scripts/review-verification-fingerprint.sh)"
          source_sha="$(git rev-parse HEAD)"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "verification=$verification" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${{ github.repository }}-backend:$backend" >> "$GITHUB_OUTPUT"
          echo "migration_image=ghcr.io/${{ github.repository }}-content-migration:$backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${{ github.repository }}-frontend-runtime:$frontend" >> "$GITHUB_OUTPUT"
          echo "baseline_image=ghcr.io/${{ github.repository }}-review-baseline:$baseline" >> "$GITHUB_OUTPUT"
          echo "verification_image=ghcr.io/${{ github.repository }}-review-verification:$verification" >> "$GITHUB_OUTPUT"

      - name: 拉取已验证 Backend / Content Migration images
        timeout-minutes: 12
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.review-identities.outputs.backend_image }}
          MIGRATION_IMAGE: ${{ steps.review-identities.outputs.migration_image }}
          BACKEND_FINGERPRINT: ${{ steps.review-identities.outputs.backend }}
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$MIGRATION_IMAGE"; do
            if ! docker manifest inspect "$image" >/dev/null 2>manifest.err; then
              cat manifest.err
              echo "完整 CI Backend job 未发布所需 verified image：$image" >&2
              exit 1
            fi
            docker pull "$image"
            actual="$(docker inspect --format '{{ index .Config.Labels "io.jilinjobs.backend-fingerprint" }}' "$image")"
            test "$actual" = "$BACKEND_FINGERPRINT"
          done

      - name: 构建并发布 Frontend Runtime image
        shell: bash
        env:
          FRONTEND_IMAGE: ${{ steps.review-identities.outputs.frontend_image }}
          FRONTEND_FINGERPRINT: ${{ steps.review-identities.outputs.frontend }}
          SOURCE_SHA: ${{ steps.review-identities.outputs.source_sha }}
        run: |
          set -euo pipefail
          rm -rf frontend-runtime-build
          mkdir -p frontend-runtime-build/public frontend-runtime-build/admin
          cp -a public-site-dist/. frontend-runtime-build/public/
          cp -a admin-dist/. frontend-runtime-build/admin/
          cp frontend/nginx.e2e.conf frontend-runtime-build/nginx.conf
          cp frontend/Dockerfile.runtime frontend-runtime-build/Dockerfile

          docker build             --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"             --label "org.opencontainers.image.revision=$SOURCE_SHA"             --label "io.jilinjobs.frontend-runtime-fingerprint=$FRONTEND_FINGERPRINT"             -t "$FRONTEND_IMAGE" frontend-runtime-build
          docker push "$FRONTEND_IMAGE"

      - name: 解析 Review Baseline cache
        id: baseline-cache
        shell: bash
        env:
          BASELINE_IMAGE: ${{ steps.review-identities.outputs.baseline_image }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$BASELINE_IMAGE" >"$RUNNER_TEMP/baseline-manifest.json" 2>"$RUNNER_TEMP/baseline-manifest.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            docker pull "$BASELINE_IMAGE"
            exit 0
          fi

          if grep -Eqi 'manifest unknown|name unknown|not found' "$RUNNER_TEMP/baseline-manifest.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$RUNNER_TEMP/baseline-manifest.err"
          echo "无法确认 Review Baseline image 是否存在；Registry 错误不得降级为 cache miss。" >&2
          exit 1

      - name: 生成 Review Data Baseline
        if: steps.baseline-cache.outputs.exists == 'false'
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.review-identities.outputs.backend_image }}
          MIGRATION_IMAGE: ${{ steps.review-identities.outputs.migration_image }}
          BASELINE_IMAGE: ${{ steps.review-identities.outputs.baseline_image }}
          BACKEND_FINGERPRINT: ${{ steps.review-identities.outputs.backend }}
          BASELINE_FINGERPRINT: ${{ steps.review-identities.outputs.baseline }}
          SOURCE_SHA: ${{ steps.review-identities.outputs.source_sha }}
        run: bash scripts/prepare-review-baseline.sh

      - name: 恢复 Review Data Baseline
        shell: bash
        env:
          BASELINE_IMAGE: ${{ steps.review-identities.outputs.baseline_image }}
          EXPECTED_BASELINE_FINGERPRINT: ${{ steps.review-identities.outputs.baseline }}
        run: bash scripts/restore-review-baseline.sh

      - name: 启动 restored Review Runtime
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.review-identities.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.review-identities.outputs.frontend_image }}
        run: |
          set -euo pipefail
          docker rm -f review-cache-backend review-cache-frontend >/dev/null 2>&1 || true
          docker run -d --name review-cache-backend --network host             -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true'             -e DB_USERNAME=root             -e DB_PASSWORD=root             -e CMS_STATIC_ROOT=/runtime-static             -e CMS_STORAGE_ROOT=/uploads             -e CMS_SITE_PACKAGE_ROOT=/site-package             -e CMS_SITE_PACKAGE_BOOTSTRAP_ON_START=true             -v "$GITHUB_WORKSPACE/runtime-static:/runtime-static"             -v "$GITHUB_WORKSPACE/runtime-uploads:/uploads"             -v "$GITHUB_WORKSPACE/sites/jilinjobs:/site-package:ro"             "$BACKEND_IMAGE"

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns >/dev/null; then break; fi
            if [ "$i" -eq 60 ]; then docker logs review-cache-backend; exit 1; fi
            sleep 2
          done

          docker run -d --name review-cache-frontend --network host "$FRONTEND_IMAGE"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null               && curl --fail --silent http://127.0.0.1:5173/admin/ >/dev/null; then break; fi
            if [ "$i" -eq 30 ]; then docker logs review-cache-frontend; exit 1; fi
            sleep 1
          done

      - name: 验证 restored canonical Review Runtime
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-review-runtime.py http://127.0.0.1:5173 | tee review-baseline-runtime.json
          docker run --rm --init --ipc=host --network host             -e CI=true             -e CI_EXTERNAL_WEB_SERVER=true             -e PARTY_MIGRATION_RUNTIME=true             -v "$GITHUB_WORKSPACE/frontend/public-site:/work"             -w /work             mcr.microsoft.com/playwright:v1.61.0-noble             bash -lc 'npm install --no-audit --no-fund && npx playwright test tests/e2e/party-migration-runtime.spec.ts --project=chromium --reporter=line'

      - name: 发布新 Review Baseline image
        if: steps.baseline-cache.outputs.exists == 'false'
        shell: bash
        env:
          BASELINE_IMAGE: ${{ steps.review-identities.outputs.baseline_image }}
        run: docker push "$BASELINE_IMAGE"

      - name: 发布 Review Verification marker
        shell: bash
        env:
          VERIFICATION_IMAGE: ${{ steps.review-identities.outputs.verification_image }}
          VERIFICATION_FINGERPRINT: ${{ steps.review-identities.outputs.verification }}
          BACKEND_FINGERPRINT: ${{ steps.review-identities.outputs.backend }}
          FRONTEND_FINGERPRINT: ${{ steps.review-identities.outputs.frontend }}
          BASELINE_FINGERPRINT: ${{ steps.review-identities.outputs.baseline }}
          SOURCE_SHA: ${{ steps.review-identities.outputs.source_sha }}
        run: |
          set -euo pipefail
          rm -rf review-verification-marker
          mkdir -p review-verification-marker
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              'schemaVersion': 1,
              'sourceSha': os.environ['SOURCE_SHA'],
              'backendFingerprint': os.environ['BACKEND_FINGERPRINT'],
              'frontendFingerprint': os.environ['FRONTEND_FINGERPRINT'],
              'baselineFingerprint': os.environ['BASELINE_FINGERPRINT'],
              'verificationFingerprint': os.environ['VERIFICATION_FINGERPRINT'],
          }
          Path('review-verification-marker/verification.json').write_text(
              json.dumps(data, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          cat > review-verification-marker/Dockerfile <<'EOF'
          FROM alpine:3.23
          COPY verification.json /verification.json
          EOF
          docker build             --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"             --label "org.opencontainers.image.revision=$SOURCE_SHA"             --label "io.jilinjobs.backend-fingerprint=$BACKEND_FINGERPRINT"             --label "io.jilinjobs.frontend-runtime-fingerprint=$FRONTEND_FINGERPRINT"             --label "io.jilinjobs.review-baseline-fingerprint=$BASELINE_FINGERPRINT"             --label "io.jilinjobs.review-verification-fingerprint=$VERIFICATION_FINGERPRINT"             -t "$VERIFICATION_IMAGE" review-verification-marker
          docker push "$VERIFICATION_IMAGE"

      - name: 上传 Review Runtime cache 证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-runtime-cache-evidence
          path: |
            review-baseline-build/manifest.json
            review-baseline-restore/manifest.json
            review-baseline-runtime.json
            frontend/public-site/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: 输出 verified cache identities
        env:
          FRONTEND_IMAGE: ${{ steps.review-identities.outputs.frontend_image }}
          BASELINE_IMAGE: ${{ steps.review-identities.outputs.baseline_image }}
          VERIFICATION_IMAGE: ${{ steps.review-identities.outputs.verification_image }}
        run: |
          {
            echo "Frontend Runtime image：$FRONTEND_IMAGE"
            echo "Review Baseline image：$BASELINE_IMAGE"
            echo "Review Verification marker：$VERIFICATION_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理 Review Runtime
        if: always()
        run: docker rm -f review-cache-backend review-cache-frontend review-baseline-backend review-baseline-copy || true
