name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
      - name: Test and package backend
        working-directory: backend
        run: gradle clean test bootJar --no-daemon
      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/build/libs/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: Browser verification
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: jilinjobs_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-artifact
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Prepare versioned static baseline
        run: |
          rm -rf runtime-static
          mkdir -p runtime-static
          cp -a site-baseline/static/. runtime-static/
          test -f runtime-static/health/baseline.png
      - name: Pull predefined runtime images
        timeout-minutes: 12
        run: |
          docker pull eclipse-temurin:21-jre-alpine-3.23 &
          java_image_pid=$!
          docker pull nginx:1.29.8-alpine &
          nginx_image_pid=$!
          docker pull mcr.microsoft.com/playwright:v1.61.0-noble &
          playwright_image_pid=$!
          wait "$java_image_pid"
          wait "$nginx_image_pid"
          wait "$playwright_image_pid"
      - name: Start backend runtime container
        timeout-minutes: 5
        run: |
          docker run -d --name cms-backend --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            -e CMS_STATIC_ROOT=/static-baseline \
            -v "$GITHUB_WORKSPACE/backend-artifact:/app:ro" \
            -v "$GITHUB_WORKSPACE/runtime-static:/static-baseline" \
            eclipse-temurin:21-jre-alpine-3.23 \
            java -jar /app/jilinjobs-cms-backend-0.1.0-SNAPSHOT.jar
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/admin/columns > /dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then docker logs cms-backend; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/static/health/baseline.png > /dev/null
      - name: Start frontend runtime container
        timeout-minutes: 5
        run: |
          docker run -d --name cms-frontend --network host \
            -v "$GITHUB_WORKSPACE/frontend-dist:/usr/share/nginx/html:ro" \
            -v "$GITHUB_WORKSPACE/frontend/nginx.e2e.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29.8-alpine
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs cms-frontend
          exit 1
      - name: Run browser-level verification
        timeout-minutes: 10
        run: |
          docker run --rm --init --ipc=host --network host \
            -e CI=true \
            -e CI_EXTERNAL_WEB_SERVER=true \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -lc 'npm install --no-audit --no-fund && npm run test:e2e'
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 5
      - name: Capture runtime diagnostics
        if: failure()
        run: |
          mkdir -p runtime-diagnostics
          docker ps -a > runtime-diagnostics/docker-ps.txt 2>&1 || true
          docker inspect cms-backend > runtime-diagnostics/backend-inspect.json 2>&1 || true
          docker logs cms-backend > runtime-diagnostics/backend.log 2>&1 || true
          docker inspect cms-frontend > runtime-diagnostics/frontend-inspect.json 2>&1 || true
          docker logs cms-frontend > runtime-diagnostics/frontend.log 2>&1 || true
      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-diagnostics
          path: runtime-diagnostics
          if-no-files-found: error
          retention-days: 5
      - name: Show runtime logs on failure
        if: failure()
        run: |
          docker logs cms-backend || true
          docker logs cms-frontend || true
      - name: Stop runtime containers
        if: always()
        run: |
          docker rm -f cms-backend cms-frontend || true
