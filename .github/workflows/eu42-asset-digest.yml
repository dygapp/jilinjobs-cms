name: EU-42 Asset Digest

on:
  push:
    branches:
      - feature/eu-42-site-asset-runtime-projection
    paths:
      - ".github/workflows/eu42-asset-digest.yml"

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Derive Site Package asset manifest entries
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('site-baseline/static')
          entries = []
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name not in {'README.md', 'PROVENANCE.md'}):
              rel = path.relative_to(root).as_posix()
              entries.append({
                  'source': f'assets/{rel}',
                  'target': f'/static/{rel}',
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          print('EU42_ASSET_MANIFEST=' + json.dumps(entries, ensure_ascii=False, separators=(',', ':')))
          PY
