name: EU-40 Technical Authority Repair

on:
  push:
    branches: [docs/eu40-post-integration-closure]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/eu40-post-integration-closure
          fetch-depth: 0
      - name: Repair Technical Authority
        run: python3 .github/eu40-technical-authority-repair.py
      - name: Validate and commit
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/technical/cms-site-package-boundary.md
          git commit -m "docs(eu40): 恢复 Technical Authority 章节"
          git push origin HEAD:docs/eu40-post-integration-closure
