name: EU-42 Authority Closure

on:
  push:
    branches:
      - docs/eu-42-post-integration-closure
    paths:
      - ".github/workflows/eu42-authority-closure.yml"

permissions:
  contents: write

jobs:
  close-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/eu-42-post-integration-closure
          fetch-depth: 0
      - name: Update EU-42 Consumer authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_one(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern[:100]!r}')
              p.write_text(updated, encoding='utf-8')

          # AGENTS.md
          replace_one(
              'AGENTS.md',
              'EU-40 — Explicit Site Package Runtime Composition Activation 与 EU-41 — Site Bootstrap & Generic Schema Baseline Separation；EU-37～EU-41 均已完成',
