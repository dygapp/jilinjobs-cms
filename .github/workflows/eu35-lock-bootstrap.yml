name: EU-35 Lock Bootstrap

on:
  push:
    branches:
      - feature/eu35-shared-rich-text-authoring

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/eu35-shared-rich-text-authoring
          fetch-depth: 0

      - name: Restore pre-bootstrap lock
        run: git checkout 1b2683502d7ee41230a168778f9cd1ccc4be08d7 -- frontend/admin/package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Regenerate package lock
        working-directory: frontend/admin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lock and remove bootstrap workflow
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/admin/package-lock.json
          git rm .github/workflows/eu35-lock-bootstrap.yml
          git commit -m "chore(admin): 最小化 Tiptap 依赖锁差异"
          git push origin HEAD:feature/eu35-shared-rich-text-authoring
