name: 导入中心党建 Banner 基线资源

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import-party-banner:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/party-building-visual-fidelity'
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: 下载并校验原站 Banner
        id: import
        run: |
          set -euo pipefail
          target='site-baseline/static/party-building/party-header-banner.jpg'
          if [ -f "$target" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl --fail --show-error --location --retry 5 --retry-delay 2 \
            'https://24365.jl.smartedu.cn/webfile/theme2/img/party_banner.png' \
            --output /tmp/party-header-banner.jpg

          echo '7444d50235d4c87a00d0221ac84551ea083c617bb8a15e58f58d002224bd27a3  /tmp/party-header-banner.jpg' | sha256sum -c -
          file /tmp/party-header-banner.jpg | grep -q 'JPEG image data'
          mkdir -p "$(dirname "$target")"
          mv /tmp/party-header-banner.jpg "$target"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: 提交版本化基线资源
        if: steps.import.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-baseline/static/party-building/party-header-banner.jpg
          git commit -m 'chore(party): 导入原站 Banner 基线资源'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
