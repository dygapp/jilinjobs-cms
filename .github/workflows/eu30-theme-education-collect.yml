name: EU-30 Theme Education Migration Candidate

on:
  push:
    branches:
      - feature/eu-30-carousel-convergence
    paths:
      - 'data-migrations/tools/eu30-theme-collector.mjs'
      - 'data-migrations/scripts/merge-eu30-theme-candidate.py'
      - '.github/workflows/eu30-theme-education-collect.yml'
  workflow_dispatch:

concurrency:
  group: eu30-theme-education-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    name: Collect and persist theme education candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install migration collector dependencies
        working-directory: data-migrations
        run: npm install --no-audit --no-fund

      - name: Collect legacy theme education scope
        working-directory: data-migrations
        env:
          MIGRATION_OUTPUT: party/eu30-theme-candidate
        run: node tools/eu30-theme-collector.mjs

      - name: Merge candidate into repository canonical workspace
        run: |
          python3 data-migrations/scripts/merge-eu30-theme-candidate.py \
            data-migrations/party/eu30-theme-candidate \
            data-migrations/party/v1 \
            --run-id "${{ github.run_id }}" \
            --head-sha "${{ github.sha }}"
          rm -rf data-migrations/party/eu30-theme-candidate

      - name: Validate persisted candidate shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('data-migrations/party/v1')
          manifest=json.load(open(root/'manifest.json', encoding='utf-8'))
          assert manifest['status']=='candidate-extension', manifest['status']
          ext=manifest['candidateExtension']
          assert ext['status']=='pending-human-review' and ext['unresolved']==0, ext
          rows=[json.loads(line) for line in (root/'index.ndjson').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows)==ext['runtimeDatasetArticles'], (len(rows), ext)
          theme=[row for row in rows if row['columnAlias']=='party-theme-education']
          assert len(theme)==ext['addedArticles']==ext['reportedTotal'], (len(theme), ext)
          assert any(row['legacyKey']=='zhutijiaoyu:content:154659859759104' for row in theme)
          carousel_root=root/'lists/PARTY_CAROUSEL'
          index=json.load(open(carousel_root/'index.json', encoding='utf-8'))
          ref=next(row for row in index['items'] if row['legacyKey']=='party-carousel:position:2')
          item=json.load(open(carousel_root/ref['path'], encoding='utf-8'))
          assert item['sourceType']=='ARTICLE', item
          assert item['articleRef']['legacyKey']=='zhutijiaoyu:content:154659859759104', item
          assert item['image']['sha256']=='a00db48e094e24b778374ae621b6f150e235625c62f17efc860391223fac830b', item
          print(json.dumps({'themeArticles':len(theme),'runtimeDatasetArticles':len(rows)}, ensure_ascii=False))
          PY

      - name: Commit durable migration candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-migrations/party/v1
          if git diff --cached --quiet; then
            echo "No canonical candidate changes"
            exit 0
          fi
          git commit -m "data(migration): 补充主题教育历史内容候选"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eu30-theme-education-collection
          path: |
            data-migrations/party/v1/manifest.json
            data-migrations/party/v1/reports/eu30-theme-education-candidate.json
          if-no-files-found: warn
          retention-days: 14
