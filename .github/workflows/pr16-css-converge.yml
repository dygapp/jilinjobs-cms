name: PR16 临时视觉收敛

on:
  push:
    branches:
      - feature/site-visual-fidelity-20260828

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/site-visual-fidelity-20260828
          fetch-depth: 0

      - name: 修正栏目标题标记与移动端Header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/style.css')
          text = path.read_text()

          old = ".section-title{height:42px;display:flex;align-items:center;background-image:url('/static/icons/section-mark.png');background-repeat:no-repeat;background-position:left bottom;background-size:1200px 29px}\n.section-title h2{margin:0;padding-left:20px;color:#323b47;font-size:24px;font-weight:500;line-height:42px}"
          new = ".section-title{height:42px;display:flex;align-items:center;position:relative;background:none}\n.section-title::before{content:\"\";flex:0 0 4px;width:4px;height:18px;margin-right:12px;background:linear-gradient(to bottom,#00aebd 0 50%,#005cd4 50%)}\n.section-title h2{margin:0;padding:0;color:#323b47;font-size:20px;font-weight:500;line-height:42px}"
          if text.count(old) != 1:
              raise SystemExit(f'section-title target count != 1: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = ".site-hero{height:105px;background-size:auto 105px;background-position:center bottom}"
          new = ".site-hero{height:64px;background-size:100% auto;background-position:center center}"
          if text.count(old) != 1:
              raise SystemExit(f'mobile hero target count != 1: {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: 提交视觉收敛结果
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/style.css
          git diff --cached --check
          git commit -m 'fix(frontend): 收敛首页标题标记与移动端头部'
          git push origin HEAD:feature/site-visual-fidelity-20260828
