name: EU-55 Fix Generic Migration Fixture

on:
  push:
    branches:
      - feature/eu-55-structured-page-card-adoption
    paths:
      - .github/workflows/eu55-fix-generic-migration-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/eu-55-structured-page-card-adoption
          fetch-depth: 0
      - name: Patch V4 Generic Page fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/apps/content-migration/src/test/kotlin/com/jilinjobs/cms/GenericPageContentMigrationVerification.kt')
          s = p.read_text(encoding='utf-8')
          start = s.index('private fun seedPageTargets')
          end = s.index('private data class PageRuntimeState')
          block = s[start:end]
          old_cols = 'body_html,render_mode,embed_url,sort_order,enabled,preset'
          new_cols = 'body_html,content_model,renderer_key,content_owner,structured_payload,embed_url,sort_order,enabled,preset'
          if block.count(old_cols) != 3:
              raise SystemExit(f'legacy seed column count={block.count(old_cols)}')
          block = block.replace(old_cols, new_cols)
          old_values = "'RICH_TEXT',NULL,0,1,1"
          new_values = "'RICH_TEXT','RICH_TEXT','OPERATOR',NULL,NULL,0,1,1"
          if block.count(old_values) != 3:
              raise SystemExit(f'legacy seed values count={block.count(old_values)}')
          block = block.replace(old_values, new_values)
          if 'render_mode' in block:
              raise SystemExit('legacy render_mode remains in seedPageTargets')
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/eu55-fix-generic-migration-fixture.yml
          git add backend/apps/content-migration/src/test/kotlin/com/jilinjobs/cms/GenericPageContentMigrationVerification.kt
          git diff --cached --check
          git commit -m "test: align Generic Page migration fixture with V4"
          git push origin HEAD:feature/eu-55-structured-page-card-adoption