name: 页面细节原站取证

on:
  push:
    branches:
      - feature/page-detail-visual-convergence-20260828
    paths:
      - .github/workflows/page-detail-reference-capture.yml
      - scripts/page-detail-reference-capture.js

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 采集原站页面细节证据
        run: |
          rm -rf page-detail-reference
          mkdir -p page-detail-reference
          docker run --rm --init --ipc=host \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            node scripts/page-detail-reference-capture.js

      - name: 输出取证摘要
        run: cat page-detail-reference/summary.txt

      - name: 上传原站页面细节证据
        uses: actions/upload-artifact@v7
        with:
          name: original-page-detail-reference
          path: page-detail-reference
          if-no-files-found: error
          retention-days: 5
