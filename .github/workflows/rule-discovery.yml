name: Rule Discovery

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/architecture/rule.md'
      - 'docs/architecture/rule-discovery.md'
      - 'docs/architecture/skill.md'
      - 'docs/project/project-capability-profile.md'
      - 'docs/rules/**'
      - 'skills/**'
      - 'tools/rule-discovery/**'
      - '.github/workflows/rule-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/architecture/rule.md'
      - 'docs/architecture/rule-discovery.md'
      - 'docs/architecture/skill.md'
      - 'docs/project/project-capability-profile.md'
      - 'docs/rules/**'
      - 'skills/**'
      - 'tools/rule-discovery/**'
      - '.github/workflows/rule-discovery.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character commit SHA to discover against'
        required: true
        type: string
      signals_json:
        description: 'Task signals JSON'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  rule-discovery:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Consumer-local Rule Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact verification subject
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact verification subject
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "checked-out SHA does not match verification subject"
            exit 2
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Deterministic contract tests
        run: python3 -m unittest discover -s tools/rule-discovery/tests -v

      - name: Lint Rules and Skills
        run: python3 tools/rule-discovery/rule_discovery.py --repo-root . lint

      - name: Initial communication discovery trace
        shell: bash
        run: |
          python3 tools/rule-discovery/rule_discovery.py --repo-root . discover \
            --signals-json '{"phases":null,"activities":["communication"],"technologies":[],"artifacts":["human-facing-content"],"risks":[]}' \
            | tee /tmp/communication-discovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/communication-discovery.json').read_text())
          ids = {item['id'] for item in payload['candidates']}
          assert 'rule:human-facing-content-integrity' in ids
          PY

      - name: Ordinary generation discovery trace
        shell: bash
        run: |
          python3 tools/rule-discovery/rule_discovery.py --repo-root . discover \
            --signals-json '{"phases":["execute"],"activities":["implementation"],"technologies":["python"],"artifacts":["code","configuration","test"],"risks":[]}' \
            | tee /tmp/generation-discovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/generation-discovery.json').read_text())
          assert payload['status'] == 'ok'
          assert [item['id'] for item in payload['candidates']] == [
              'rule:execution-continuity',
              'rule:implementation-discipline',
          ]
          assert all(set(item) == {'id', 'path'} for item in payload['candidates'])
          PY

      - name: Task-level Vue discovery trace
        shell: bash
        run: |
          python3 tools/rule-discovery/rule_discovery.py --repo-root . discover \
            --signals-json '{"phases":["execute"],"activities":["implementation"],"technologies":["vue3"],"artifacts":["vue-sfc","code"],"risks":[]}' \
            | tee /tmp/vue-discovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/vue-discovery.json').read_text())
          assert payload['status'] == 'ok'
          candidate = next(item for item in payload['candidates'] if item['id'] == 'rule:vue-component-authoring')
          assert candidate['path'] == 'docs/rules/technology/vue/component-authoring.md'
          PY

      - name: Ordinary verification discovery trace
        shell: bash
        run: |
          python3 tools/rule-discovery/rule_discovery.py --repo-root . discover \
            --signals-json '{"phases":["converge"],"activities":["verification"],"technologies":[],"artifacts":["commit","evidence"],"risks":["evidence-reuse"]}' \
            | tee /tmp/verification-discovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/verification-discovery.json').read_text())
          assert payload['status'] == 'ok'
          assert [item['id'] for item in payload['candidates']] == [
              'rule:evidence-claim-reuse-across-commits',
              'rule:evidence-type-must-match-claim',
              'rule:execution-continuity',
              'rule:integration-state-closure-review',
          ]
          assert all(set(item) == {'id', 'path'} for item in payload['candidates'])
          PY

  task-rule-discovery:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/rule-discovery ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    name: Exact-SHA task Rule Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare task discovery request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET_SHA: ${{ inputs.target_sha }}
          DISPATCH_SIGNALS_JSON: ${{ inputs.signals_json }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          event_name = os.environ['EVENT_NAME']
          if event_name == 'workflow_dispatch':
              target_sha = os.environ['DISPATCH_TARGET_SHA'].strip()
              signals_text = os.environ['DISPATCH_SIGNALS_JSON'].strip()
          elif event_name == 'issue_comment':
              body = os.environ['COMMENT_BODY']
              prefix = '/rule-discovery '
              if not body.startswith(prefix):
                  raise SystemExit('comment is not a task-level Rule Discovery request')
              request = body[len(prefix):].strip()
              try:
                  target_sha, signals_text = request.split(maxsplit=1)
              except ValueError as exc:
                  raise SystemExit('expected: /rule-discovery <40-char-sha> <signals-json>') from exc
          else:
              raise SystemExit(f'unsupported event: {event_name}')

          if not re.fullmatch(r'[0-9a-fA-F]{40}', target_sha):
              raise SystemExit('target_sha must be an exact 40-character commit SHA')

          try:
              signals = json.loads(signals_text)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'invalid signals JSON: {exc.msg}') from exc

          signals_path = Path(os.environ['RUNNER_TEMP']) / 'task-rule-discovery-signals.json'
          signals_path.write_text(
              json.dumps(signals, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'target_sha={target_sha.lower()}\n')
              output.write(f'signals_path={signals_path}\n')

          print(json.dumps({
              'event': event_name,
              'target_sha': target_sha.lower(),
              'signals': signals,
          }, ensure_ascii=False))
          PY

      - name: Checkout exact target
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 1

      - name: Run exact-SHA task discovery
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          SIGNALS_PATH: ${{ steps.request.outputs.signals_path }}
        run: |
          result_path="$RUNNER_TEMP/task-rule-discovery-result.json"
          context_path="$RUNNER_TEMP/task-rule-discovery-context.json"
          actual_sha="$(git rev-parse HEAD)"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          signals = json.loads(Path(os.environ['SIGNALS_PATH']).read_text(encoding='utf-8'))
          context = {
              'requested_sha': os.environ['TARGET_SHA'],
              'actual_sha': os.popen('git rev-parse HEAD').read().strip(),
              'signals': signals,
          }
          Path(os.environ['RUNNER_TEMP'], 'task-rule-discovery-context.json').write_text(
              json.dumps(context, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            printf '{"status":"fail-closed","candidates":[],"diagnostics":["checked-out SHA does not match requested SHA"]}\n' > "$result_path"
            cat "$context_path"
            cat "$result_path"
            exit 2
          fi

          set +e
          python3 tools/rule-discovery/rule_discovery.py --repo-root . discover \
            --signals-file "$SIGNALS_PATH" > "$result_path"
          discovery_status=$?
          set -e

          cat "$context_path"
          cat "$result_path"
          exit "$discovery_status"

      - name: Upload task discovery evidence
        if: always() && steps.request.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: task-rule-discovery-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/task-rule-discovery-signals.json
            ${{ runner.temp }}/task-rule-discovery-context.json
            ${{ runner.temp }}/task-rule-discovery-result.json
