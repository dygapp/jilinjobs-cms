spring:
  application:
    name: jilinjobs-cms
  config:
    import: optional:classpath:cms-metadata.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jilinjobs_cms?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

cms:
  storage:
    root: ${CMS_STORAGE_ROOT:./data/uploads}
  static:
    root: ${CMS_STATIC_ROOT:./data/static}

server:
  port: ${SERVER_PORT:8080}
